<svg xmlns="http://www.w3.org/2000/svg" width="736" height="172" viewBox="0 0 736 172" role="img" aria-labelledby="t-webpack-bundle-flow d-webpack-bundle-flow">
  <title id="t-webpack-bundle-flow">打包器的一趟工作：入口进，单文件出</title>
  <desc id="d-webpack-bundle-flow">四步流程图。第一步「入口文件」：给打包器一个 entry，从这里开始。第二步「构建依赖图」：顺着 import 找出所有相关文件。第三步「合并打包」：把所有相关文件合并到一起，输出一个包含全部必要代码的单一文件。第四步「额外优化（可选）」：压缩代码、图片优化、摇树（把没用到的代码摇出产物）。图下说明：入口与依赖图的概念在 ESM 课学过，在打包语境原样适用；额外优化大多超出本课程范围——本课专注基础 JS 打包与 HTML、CSS、图片的处理。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="26" y="26" width="132" height="62" rx="6"/>
  <text class="hb" x="92" y="55" text-anchor="middle"><tspan x="92">入口文件</tspan></text>
  <text class="s" x="92" y="68" text-anchor="middle"><tspan x="92">给打包器一个</tspan><tspan x="92" dy="15">entry</tspan></text>
  <rect class="box" x="210" y="26" width="132" height="62" rx="6"/>
  <text class="hb" x="276" y="55" text-anchor="middle"><tspan x="276">构建依赖图</tspan></text>
  <text class="s" x="276" y="68" text-anchor="middle"><tspan x="276">顺着 import 找出</tspan><tspan x="276" dy="15">所有相关文件</tspan></text>
  <path class="edge" d="M158,57 L203,57" marker-end="url(#arr)"/>
  <rect class="box" x="394" y="26" width="132" height="62" rx="6"/>
  <text class="hb" x="460" y="55" text-anchor="middle"><tspan x="460">合并打包</tspan></text>
  <text class="s" x="460" y="68" text-anchor="middle"><tspan x="460">输出包含全部代码的</tspan><tspan x="460" dy="15">单一文件</tspan></text>
  <path class="edge" d="M342,57 L387,57" marker-end="url(#arr)"/>
  <rect class="accentbox" x="578" y="26" width="132" height="62" rx="6"/>
  <text class="hb" x="644" y="55" text-anchor="middle"><tspan x="644">额外优化（可选）</tspan></text>
  <text class="s" x="644" y="68" text-anchor="middle"><tspan x="644">压缩 / 图片优化</tspan><tspan x="644" dy="15">/ 摇树</tspan></text>
  <path class="edge" d="M526,57 L571,57" marker-end="url(#arr)"/>
  <rect class="note" x="26" y="94" width="684" height="52" rx="6"/>
  <text class="s" x="368" y="116" text-anchor="middle"><tspan x="368">入口与依赖图的概念在 ESM 课学过，打包语境原样适用；额外优化大多超出本课程范围——本课专注基础 JS 打包与</tspan><tspan x="368" dy="18">HTML、CSS、图片的处理。</tspan></text>
</svg>
