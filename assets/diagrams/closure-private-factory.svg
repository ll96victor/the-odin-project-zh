<svg xmlns="http://www.w3.org/2000/svg" width="612" height="296" viewBox="0 0 612 296" role="img" aria-labelledby="t-closure-private-factory d-closure-private-factory">
  <title id="t-closure-private-factory">工厂函数的私有变量：闭包把作用域留了下来</title>
  <desc id="d-closure-private-factory">五步流程图。第一步「调用 createUser(josh)」：函数体执行一遍。第二步「let reputation = 0」：变量出生在这次调用的作用域里。第三步「返回只带两个闭包的对象」：getReputation 与 giveReputation，reputation 本体不在返回对象里。第四步「作用域没有销毁」：闭包让变量随方法一起活着。第五步「josh.reputation 是 undefined」：外界摸不到变量本体，只能走留下的两个函数。图下说明：对象简写 { reputation } 只是复制当时的值，不是返回变量本身——访问私有变量的唯一途径是闭包。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="26" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="102" y="46" text-anchor="middle"><tspan x="102">调用</tspan><tspan x="102" dy="18">createUser("josh")</tspan></text>
  <text class="s" x="102" y="75" text-anchor="middle"><tspan x="102">函数体执行一遍</tspan></text>
  <rect class="box" x="230" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="306" y="46" text-anchor="middle"><tspan x="306">let reputation</tspan><tspan x="306" dy="18">= 0</tspan></text>
  <text class="s" x="306" y="68" text-anchor="middle"><tspan x="306">变量出生在这次调用的</tspan><tspan x="306" dy="15">作用域</tspan></text>
  <path class="edge" d="M178,57 L223,57" marker-end="url(#arr)"/>
  <rect class="box" x="434" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="510" y="46" text-anchor="middle"><tspan x="510">返回对象只带两个</tspan><tspan x="510" dy="18">闭包</tspan></text>
  <text class="s" x="510" y="68" text-anchor="middle"><tspan x="510">getReputation /</tspan><tspan x="510" dy="15">giveReputation</tspan></text>
  <path class="edge" d="M382,57 L427,57" marker-end="url(#arr)"/>
  <rect class="box" x="26" y="150" width="152" height="62" rx="6"/>
  <text class="hb" x="102" y="179" text-anchor="middle"><tspan x="102">作用域没有销毁</tspan></text>
  <text class="s" x="102" y="199" text-anchor="middle"><tspan x="102">闭包让变量随方法活着</tspan></text>
  <rect class="accentbox" x="230" y="150" width="152" height="62" rx="6"/>
  <text class="hb" x="306" y="170" text-anchor="middle"><tspan x="306">josh.reputation →</tspan><tspan x="306" dy="18">undefined</tspan></text>
  <text class="s" x="306" y="192" text-anchor="middle"><tspan x="306">外界只能走留下的两</tspan><tspan x="306" dy="15">个函数</tspan></text>
  <path class="edge" d="M178,181 L223,181" marker-end="url(#arr)"/>
  <path class="edge" d="M510,88 L510,119 L102,119 L102,143" marker-end="url(#arr)"/>
  <rect class="note" x="26" y="218" width="560" height="52" rx="6"/>
  <text class="s" x="306" y="240" text-anchor="middle"><tspan x="306">对象简写 { reputation } 只是复制当时的值，不是返回变量本身——访问私有变量的唯一途径</tspan><tspan x="306" dy="18">是闭包。</tspan></text>
</svg>
