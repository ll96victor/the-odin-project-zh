<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="278" viewBox="0 0 1020 278" role="img" aria-labelledby="t-job-search-nine-steps d-job-search-nine-steps">
  <title id="t-job-search-nine-steps">通往工作的官方九步路径</title>
  <desc id="d-job-search-nine-steps">流程图，九个方框分两行。第一行依次为：①弄清你的需求与技能（一切从你开始）、②弄清公司要什么给什么（三要素视角）、③提前铺垫提高胜率（技能/叙事/作品集/形象）、④收集工作线索（电子表格主数据库）、⑤筛选工作线索（期望值 = 概率 × 价值）；第二行依次为：⑥接触并申请（迭代式、走侧门）、⑦面试（七步漏斗）、⑧处理 offer（别立刻接受）、⑨Profit??（官方原文自带双问号）。图下注：第 1–3 步 =「准备求职」章，第 4–8 步 =「投递与面试」章。没有计划：要么海投简历纳闷为什么没回音，要么走完漫长流程才发现根本不想要那份工作。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #878c87; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="26" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="102" y="55" text-anchor="middle"><tspan x="102">弄清你的需求与技能</tspan></text>
  <text class="s" x="102" y="75" text-anchor="middle"><tspan x="102">一切从你开始</tspan></text>
  <rect class="box" x="230" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="306" y="46" text-anchor="middle"><tspan x="306">弄清公司要什么给</tspan><tspan x="306" dy="18">什么</tspan></text>
  <text class="s" x="306" y="75" text-anchor="middle"><tspan x="306">三要素视角</tspan></text>
  <path class="edge" d="M178,57 L223,57" marker-end="url(#arr)"/>
  <rect class="box" x="434" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="510" y="55" text-anchor="middle"><tspan x="510">提前铺垫提高胜率</tspan></text>
  <text class="s" x="510" y="75" text-anchor="middle"><tspan x="510">技能/叙事/作品集/形象</tspan></text>
  <path class="edge" d="M382,57 L427,57" marker-end="url(#arr)"/>
  <rect class="box" x="638" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="714" y="55" text-anchor="middle"><tspan x="714">收集工作线索</tspan></text>
  <text class="s" x="714" y="75" text-anchor="middle"><tspan x="714">电子表格主数据库</tspan></text>
  <path class="edge" d="M586,57 L631,57" marker-end="url(#arr)"/>
  <rect class="box" x="842" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="918" y="55" text-anchor="middle"><tspan x="918">筛选工作线索</tspan></text>
  <text class="s" x="918" y="75" text-anchor="middle"><tspan x="918">期望值 = 概率 × 价值</tspan></text>
  <path class="edge" d="M790,57 L835,57" marker-end="url(#arr)"/>
  <rect class="box" x="26" y="150" width="152" height="62" rx="6"/>
  <text class="hb" x="102" y="179" text-anchor="middle"><tspan x="102">接触并申请</tspan></text>
  <text class="s" x="102" y="199" text-anchor="middle"><tspan x="102">迭代式、走侧门</tspan></text>
  <rect class="box" x="230" y="150" width="152" height="62" rx="6"/>
  <text class="hb" x="306" y="179" text-anchor="middle"><tspan x="306">面试</tspan></text>
  <text class="s" x="306" y="199" text-anchor="middle"><tspan x="306">七步漏斗</tspan></text>
  <path class="edge" d="M178,181 L223,181" marker-end="url(#arr)"/>
  <rect class="box" x="434" y="150" width="152" height="62" rx="6"/>
  <text class="hb" x="510" y="179" text-anchor="middle"><tspan x="510">处理 offer</tspan></text>
  <text class="s" x="510" y="199" text-anchor="middle"><tspan x="510">别立刻接受</tspan></text>
  <path class="edge" d="M382,181 L427,181" marker-end="url(#arr)"/>
  <rect class="accentbox" x="638" y="150" width="152" height="62" rx="6"/>
  <text class="hb" x="714" y="179" text-anchor="middle"><tspan x="714">Profit??</tspan></text>
  <text class="s" x="714" y="199" text-anchor="middle"><tspan x="714">官方原文自带双问号</tspan></text>
  <path class="edge" d="M586,181 L631,181" marker-end="url(#arr)"/>
  <path class="edge" d="M918,88 L918,119 L102,119 L102,143" marker-end="url(#arr)"/>
  <rect class="note" x="26" y="218" width="968" height="34" rx="6"/>
  <text class="s" x="510" y="240" text-anchor="middle"><tspan x="510">第 1–3 步 =「准备求职」章，第 4–8 步 =「投递与面试」章。没有计划：要么海投简历纳闷为什么没回音，要么走完漫长流程才发现根本不想要那份工作。</tspan></text>
</svg>
