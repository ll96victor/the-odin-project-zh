<svg xmlns="http://www.w3.org/2000/svg" width="760" height="282" viewBox="0 0 760 282" role="img" aria-labelledby="t-git-command-anatomy d-git-command-anatomy">
  <title id="t-git-command-anatomy">三段式语法：program | action | destination</title>
  <desc id="d-git-command-anatomy">解剖图。顶部三个小盒演示用同一模式读命令：git | add | .，句点代表当前目录里的所有内容；git | commit -m | "message"；git | status |（没有目标）。主体横条把 git push origin main 拆成三段：program（程序，永远是 git）、action（动作）、destination（目标，origin 远端仓库加 main 分支）。下方注释逐段解释：动作说明做什么——push 上传、add 暂存、commit 记录、status 查看；目标说明对什么做——可以是远端分支、文件或当前目录。学会用这个模式去读，以后见到新命令就不会慌。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="chip" x="100" y="24" width="160" height="38" rx="6"/>
  <text class="b" x="180" y="48" text-anchor="middle"><tspan x="180">git | add | .</tspan></text>
  <rect class="chip" x="300" y="24" width="160" height="38" rx="6"/>
  <text class="b" x="380" y="39" text-anchor="middle"><tspan x="380">git | commit -m |</tspan><tspan x="380" dy="17">"message"</tspan></text>
  <path class="edge" d="M264,43 L293,43" marker-end="url(#arr)"/>
  <rect class="chip" x="500" y="24" width="160" height="38" rx="6"/>
  <text class="b" x="580" y="39" text-anchor="middle"><tspan x="580">git | status</tspan><tspan x="580" dy="17">|（无目 标）</tspan></text>
  <path class="edge" d="M464,43 L493,43" marker-end="url(#arr)"/>
  <text class="h" x="380" y="117" text-anchor="middle"><tspan x="380">git push origin main = program | action | destination</tspan></text>
  <rect class="accentbox" x="24" y="136" width="184" height="54" rx="6"/>
  <text class="hb" x="116" y="168" text-anchor="middle"><tspan x="116">git（program）</tspan></text>
  <rect class="box" x="208" y="136" width="184" height="54"/>
  <text class="hb" x="300" y="168" text-anchor="middle"><tspan x="300">push（action）</tspan></text>
  <path class="divider" d="M208,136 L208,190"/>
  <rect class="box" x="392" y="136" width="344" height="54"/>
  <text class="hb" x="564" y="168" text-anchor="middle"><tspan x="564">origin main（destination）</tspan></text>
  <path class="divider" d="M392,136 L392,190"/>
  <rect class="outline" x="24" y="136" width="712" height="54" rx="6"/>
  <path class="spoke" d="M116,196 L116,206 L136,218"/>
  <text class="s" x="136" y="239" text-anchor="middle"><tspan x="136">程序永远是 git</tspan></text>
  <path class="spoke" d="M300,196 L300,206 L380,218"/>
  <text class="s" x="380" y="239" text-anchor="middle"><tspan x="380">动作：push 上传 / add 暂存 /</tspan><tspan x="380" dy="17">commit 记录 / status 查看</tspan></text>
  <path class="spoke" d="M564,196 L564,206 L624,218"/>
  <text class="s" x="624" y="239" text-anchor="middle"><tspan x="624">目标：origin 远端 + main 分支；</tspan><tspan x="624" dy="17">add . 的句点 = 当前目录所有内容</tspan></text>
</svg>
