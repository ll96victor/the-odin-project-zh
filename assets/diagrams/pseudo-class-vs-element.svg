<svg xmlns="http://www.w3.org/2000/svg" width="740" height="280" viewBox="0 0 740 280" role="img" aria-labelledby="t-pseudo-class-vs-element d-pseudo-class-vs-element">
  <title id="t-pseudo-class-vs-element">伪类与伪元素：一个冒号和两个冒号</title>
  <desc id="d-pseudo-class-vs-element">对比图。左列标题「伪类 :（单冒号）」：选 HTML 里已存在的元素——按状态或结构位置；例 :hover / :focus / :active / :link / :visited 与 :root / :first-child / :empty / :nth-child；特异性同类 (0,0,1,0)，大多可链式叠加。右列标题「伪元素 ::（双冒号）」：选标记里通常不存在的部分——用 CSS 操作；::before / ::after 能凭空加内容（配 content）；例 ::marker / ::first-letter / ::first-line / ::selection；特异性同元素 (0,0,0,1)。底部注释：现行标准伪元素用双冒号——旧文章常用单冒号，官方 Assignment 专门提醒。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="22" y="22" width="335" height="188" rx="8"/>
  <path class="divider" d="M22,62 L357,62"/>
  <rect class="head" x="22" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="22" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M22,62 L357,62"/>
  <text class="hb" x="190" y="47" text-anchor="middle"><tspan x="190">伪类 :（单冒号）</tspan></text>
  <circle cx="42" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="86" text-anchor="start"><tspan x="52">选 HTML 里已存在的元素——按状态或结构位置</tspan></text>
  <circle cx="42" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="116" text-anchor="start"><tspan x="52">:hover / :focus / :active / :link /</tspan><tspan x="52" dy="18">:visited</tspan></text>
  <circle cx="42" cy="160" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="164" text-anchor="start"><tspan x="52">:root / :first-child / :empty / :nth-child</tspan></text>
  <circle cx="42" cy="190" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="194" text-anchor="start"><tspan x="52">特异性同类 (0,0,1,0)，大多可链式叠加</tspan></text>
  <rect class="box" x="383" y="22" width="335" height="188" rx="8"/>
  <path class="divider" d="M383,62 L718,62"/>
  <rect class="head" x="383" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="383" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M383,62 L718,62"/>
  <text class="hb" x="551" y="47" text-anchor="middle"><tspan x="551">伪元素 ::（双冒号）</tspan></text>
  <circle cx="403" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="86" text-anchor="start"><tspan x="413">选标记里通常不存在的部分——用 CSS 操作</tspan></text>
  <circle cx="403" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="116" text-anchor="start"><tspan x="413">::before / ::after 能凭空加内容（配 content）</tspan></text>
  <circle cx="403" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="146" text-anchor="start"><tspan x="413">::marker / ::first-letter / ::first-line /</tspan><tspan x="413" dy="18">::selection</tspan></text>
  <circle cx="403" cy="190" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="194" text-anchor="start"><tspan x="413">特异性同元素 (0,0,0,1)</tspan></text>
  <rect class="note" x="22" y="224" width="696" height="34" rx="6"/>
  <text class="s" x="370" y="246" text-anchor="middle"><tspan x="370">现行标准：伪元素双冒号（旧文章常用单冒号，官方 Assignment 专门提醒）。</tspan></text>
</svg>
