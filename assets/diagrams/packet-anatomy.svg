<svg xmlns="http://www.w3.org/2000/svg" width="760" height="282" viewBox="0 0 760 282" role="img" aria-labelledby="t-packet-anatomy d-packet-anatomy">
  <title id="t-packet-anatomy">一个数据包的解剖：序号、目标地址与数据片段</title>
  <desc id="d-packet-anatomy">图分两部分。上方是四步小流程：完整文件被拆成许多数据包，各自独立寻路，到达后按序重组。中间是一个横条，代表一个数据包（packet），从左到右分成三段：序号、目标 IP 地址、数据片段。下方三条注释分别说明：序号标记这个包是文件的第几片，到达后按序号重组还原；目标地址标记包要送去哪里，不同包可能走不同路线、到达顺序可能打乱；数据片段是原文件的一小份内容，丢失或损坏只需重传这一个包。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="chip" x="100" y="24" width="110" height="38" rx="6"/>
  <text class="b" x="155" y="48" text-anchor="middle"><tspan x="155">完整文件</tspan></text>
  <rect class="chip" x="250" y="24" width="110" height="38" rx="6"/>
  <text class="b" x="305" y="48" text-anchor="middle"><tspan x="305">拆成许多数据包</tspan></text>
  <path class="edge" d="M214,43 L243,43" marker-end="url(#arr)"/>
  <rect class="chip" x="400" y="24" width="110" height="38" rx="6"/>
  <text class="b" x="455" y="48" text-anchor="middle"><tspan x="455">各自独立寻路</tspan></text>
  <path class="edge" d="M364,43 L393,43" marker-end="url(#arr)"/>
  <rect class="chip" x="550" y="24" width="110" height="38" rx="6"/>
  <text class="b" x="605" y="48" text-anchor="middle"><tspan x="605">到达后按序重组</tspan></text>
  <path class="edge" d="M514,43 L543,43" marker-end="url(#arr)"/>
  <text class="h" x="380" y="117" text-anchor="middle"><tspan x="380">一个数据包（packet）</tspan></text>
  <rect class="accentbox" x="24" y="136" width="117" height="54" rx="6"/>
  <text class="hb" x="83" y="168" text-anchor="middle"><tspan x="83">序号</tspan></text>
  <rect class="box" x="141" y="136" width="362" height="54"/>
  <text class="hb" x="322" y="168" text-anchor="middle"><tspan x="322">目标 IP 地址</tspan></text>
  <path class="divider" d="M141,136 L141,190"/>
  <rect class="box" x="503" y="136" width="233" height="54"/>
  <text class="hb" x="620" y="168" text-anchor="middle"><tspan x="620">数据片段</tspan></text>
  <path class="divider" d="M503,136 L503,190"/>
  <rect class="outline" x="24" y="136" width="712" height="54" rx="6"/>
  <path class="spoke" d="M83,196 L83,206 L136,218"/>
  <text class="s" x="136" y="239" text-anchor="middle"><tspan x="136">这个包是文件的第几片；到达后按序</tspan><tspan x="136" dy="17">号重组还原</tspan></text>
  <path class="spoke" d="M322,196 L322,206 L380,218"/>
  <text class="s" x="380" y="239" text-anchor="middle"><tspan x="380">包要送去哪里；不同包可能走不同路</tspan><tspan x="380" dy="17">线、到达顺序可能打乱</tspan></text>
  <path class="spoke" d="M620,196 L620,206 L624,218"/>
  <text class="s" x="624" y="239" text-anchor="middle"><tspan x="624">原文件的一小份内容；丢失或损坏只</tspan><tspan x="624" dy="17">需重传这一个包</tspan></text>
</svg>
