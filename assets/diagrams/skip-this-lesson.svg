<svg xmlns="http://www.w3.org/2000/svg" width="579" height="172" viewBox="0 0 579 172" role="img" aria-labelledby="t-skip-this-lesson d-skip-this-lesson">
  <title id="t-skip-this-lesson">能不能跳过这一课：先判断两个条件</title>
  <desc id="d-skip-this-lesson">三盒流程图，从左到右：先判断操作系统——是否在用 macOS、Ubuntu 或 Ubuntu 官方风味版；再判断浏览器——是否已装好 Google Chrome；两个都是——可以跳过这一课，任何一个不是——按安装说明搭建你的开发环境。底部注释：已经符合条件的情况下重装一遍环境，是这一课最常见的无谓折腾；Assignment 里重复了同一个判断，只有不是受支持系统才需要跟某一组安装说明走。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="26" y="26" width="141" height="62" rx="6"/>
  <text class="hb" x="97" y="55" text-anchor="middle"><tspan x="97">判断① 操作系统</tspan></text>
  <text class="s" x="97" y="68" text-anchor="middle"><tspan x="97">macOS / Ubuntu /</tspan><tspan x="97" dy="15">官方风味版？</tspan></text>
  <rect class="box" x="219" y="26" width="141" height="62" rx="6"/>
  <text class="hb" x="290" y="55" text-anchor="middle"><tspan x="290">判断② 浏览器</tspan></text>
  <text class="s" x="290" y="68" text-anchor="middle"><tspan x="290">Google Chrome</tspan><tspan x="290" dy="15">装好 了？</tspan></text>
  <path class="edge" d="M167,57 L212,57" marker-end="url(#arr)"/>
  <rect class="accentbox" x="412" y="26" width="141" height="62" rx="6"/>
  <text class="hb" x="483" y="55" text-anchor="middle"><tspan x="483">都是 → 跳过这一课</tspan></text>
  <text class="s" x="483" y="68" text-anchor="middle"><tspan x="483">任一否 →</tspan><tspan x="483" dy="15">按说明搭建 环境</tspan></text>
  <path class="edge" d="M360,57 L405,57" marker-end="url(#arr)"/>
  <rect class="note" x="26" y="94" width="527" height="52" rx="6"/>
  <text class="s" x="290" y="116" text-anchor="middle"><tspan x="290">已经符合条件还重装一遍环境，是这一课最常见的无谓折腾。Assignment 里重复了同一个</tspan><tspan x="290" dy="18">判断：不是受支持系统才需要跟安装说明走。</tspan></text>
</svg>
