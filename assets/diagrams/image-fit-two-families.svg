<svg xmlns="http://www.w3.org/2000/svg" width="740" height="184" viewBox="0 0 740 184" role="img" aria-labelledby="t-image-fit-two-families d-image-fit-two-families">
  <title id="t-image-fit-two-families">图片适配两族工具：背景图一族与 img 一族</title>
  <desc id="d-image-fit-two-families">两列对比图。左列「背景图一族 · background-size 与 background-position」：写在容器上，只认 CSS 背景图，对 img 标签无效；background-size 的 cover 让图铺满容器且裁剪最少；background-position 的 center 让图永远居中，容器装不下整图时露出中间。右列「img 一族 · object-fit 与 object-position」：写在图片元素上，专为 img 等替换元素设计；默认值 fill 把图拉伸到填满尺寸，比例失真，是多数图变形事故的根源；cover 填满裁边、contain 完整留边，与左族语义相通；object-position 调整裁剪时保留哪部分。图下说明：两族共享 cover 与 contain 的语义，选择依据只有一个——图是 background-image 放进来的还是 img 标签放进来的；另外弹性宽加 height auto 是保比例的底线写法，先于两族工具。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="22" y="22" width="335" height="140" rx="8"/>
  <path class="divider" d="M22,62 L357,62"/>
  <rect class="head" x="22" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="22" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M22,62 L357,62"/>
  <text class="hb" x="190" y="47" text-anchor="middle"><tspan x="190">背景图一族 · background-size / -position</tspan></text>
  <circle cx="42" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="86" text-anchor="start"><tspan x="52">写在容器上，只认 CSS 背景图（对 &lt;img&gt; 无效）</tspan></text>
  <circle cx="42" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="116" text-anchor="start"><tspan x="52">size: cover 铺满容器、裁剪最少</tspan></text>
  <circle cx="42" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="146" text-anchor="start"><tspan x="52">position: center 装不下也永远居中</tspan></text>
  <rect class="box" x="383" y="22" width="335" height="140" rx="8"/>
  <path class="divider" d="M383,62 L718,62"/>
  <rect class="head" x="383" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="383" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M383,62 L718,62"/>
  <text class="hb" x="551" y="47" text-anchor="middle"><tspan x="551">img 一族 · object-fit / -position</tspan></text>
  <circle cx="403" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="86" text-anchor="start"><tspan x="413">写在 &lt;img&gt; 上，专为替换元素设计</tspan></text>
  <circle cx="403" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="116" text-anchor="start"><tspan x="413">默认 fill：拉伸变形——务必显式声明</tspan></text>
  <circle cx="403" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="146" text-anchor="start"><tspan x="413">cover 填满裁边 / contain 完整留边</tspan></text>
</svg>
