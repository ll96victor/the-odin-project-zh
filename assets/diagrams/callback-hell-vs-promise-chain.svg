<svg xmlns="http://www.w3.org/2000/svg" width="740" height="267" viewBox="0 0 740 267" role="img" aria-labelledby="t-callback-hell-vs-promise-chain d-callback-hell-vs-promise-chain">
  <title id="t-callback-hell-vs-promise-chain">回调地狱与 Promise 链：金字塔与一条线的差别</title>
  <desc id="d-callback-hell-vs-promise-chain">两列对比图。左列「回调串联 · 回调地狱」：每步嵌进上一步的回调体；缩进长成金字塔、越来越深；逻辑分散、错误处理各自为政。右列「Promise 链 · 平铺直叙」：.then() 一环接一环排成一条线；值沿链流动（return 即传给下一环）；.catch() 在链尾统一接错。图下说明：官方 getData() 的教训——同步思维取异步数据拿到 undefined；Promise 是「未来某个时刻可能产出一个值的对象」，.then() 告诉代码「等 resolved 再跑里面的函数」。单个回调没问题（addEventListener 天天用），失控发生在按顺序串联好几个的时候。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #878c87; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="22" y="22" width="335" height="140" rx="8"/>
  <path class="divider" d="M22,62 L357,62"/>
  <rect class="head" x="22" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="22" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M22,62 L357,62"/>
  <text class="hb" x="190" y="47" text-anchor="middle"><tspan x="190">回调串联 · 回调地狱</tspan></text>
  <circle cx="42" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="86" text-anchor="start"><tspan x="52">每步嵌进上一步的回调体</tspan></text>
  <circle cx="42" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="116" text-anchor="start"><tspan x="52">缩进长成金字塔、越来越深</tspan></text>
  <circle cx="42" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="146" text-anchor="start"><tspan x="52">逻辑分散、错误处理各自为政</tspan></text>
  <rect class="box" x="383" y="22" width="335" height="140" rx="8"/>
  <path class="divider" d="M383,62 L718,62"/>
  <rect class="head" x="383" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="383" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M383,62 L718,62"/>
  <text class="hb" x="551" y="47" text-anchor="middle"><tspan x="551">Promise 链 · 平铺直叙</tspan></text>
  <circle cx="403" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="86" text-anchor="start"><tspan x="413">.then() 一环接一环排成一条线</tspan></text>
  <circle cx="403" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="116" text-anchor="start"><tspan x="413">值沿链流动：return 即传给下一环</tspan></text>
  <circle cx="403" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="146" text-anchor="start"><tspan x="413">.catch() 在链尾统一接错</tspan></text>
  <rect class="note" x="22" y="176" width="696" height="69" rx="6"/>
  <text class="s" x="370" y="198" text-anchor="middle"><tspan x="370">官方 getData() 的教训：同步思维取异步数据拿到 undefined——Promise 是「未来某个时刻可能产出一个值的对象」，</tspan><tspan x="370" dy="18">.then() 告诉代码「等 resolved 再跑里面的函数」。单个回调没问题（addEventListener 天天用），失控发生在按</tspan><tspan x="370" dy="18">顺序串联好几个的时候。</tspan></text>
</svg>
