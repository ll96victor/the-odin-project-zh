<svg xmlns="http://www.w3.org/2000/svg" width="740" height="268" viewBox="0 0 740 268" role="img" aria-labelledby="t-git-save-vs-editor-save d-git-save-vs-editor-save">
  <title id="t-git-save-vs-editor-save">Git 的保存和文本编辑器的保存有什么不同</title>
  <desc id="d-git-save-vs-editor-save">双栏对比图。左栏是文本编辑器的保存：一次保存把文档里所有文字记录成单个文件；你只会有一个文件记录，比如 essay.doc；除非自己做重复副本——essay-draft1、essay-draft2、essay-final——而这很难记得去做、也很难追踪。右栏是 Git 的保存：一次保存记录的是文件和文件夹的差异，并且保留每一次保存的历史记录；官方评价这个特性是改变游戏规则的（a game changer）。底部注释：副本方案里「历史」是一堆你自己命名的、彼此无关的文件；Git 方案里历史是系统自动记录的、可以回看和恢复的一串状态，你不需要靠文件名去记「哪一版才是最终版」。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="22" y="22" width="335" height="158" rx="8"/>
  <path class="divider" d="M22,62 L357,62"/>
  <rect class="head" x="22" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="22" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M22,62 L357,62"/>
  <text class="hb" x="190" y="47" text-anchor="middle"><tspan x="190">文本编辑器的保存</tspan></text>
  <circle cx="42" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="86" text-anchor="start"><tspan x="52">一次保存 = 把文档所有文字记录成单个文件</tspan></text>
  <circle cx="42" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="116" text-anchor="start"><tspan x="52">只有一个文件记录，比如 essay.doc</tspan></text>
  <circle cx="42" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="146" text-anchor="start"><tspan x="52">想要历史只能自己做副本：essay-draft1、draft2、</tspan><tspan x="52" dy="18">final——很难记得做、很难追踪</tspan></text>
  <rect class="box" x="383" y="22" width="335" height="158" rx="8"/>
  <path class="divider" d="M383,62 L718,62"/>
  <rect class="head" x="383" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="383" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M383,62 L718,62"/>
  <text class="hb" x="551" y="47" text-anchor="middle"><tspan x="551">Git 的保存</tspan></text>
  <circle cx="403" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="86" text-anchor="start"><tspan x="413">一次保存记录的是文件和文件夹的差异</tspan></text>
  <circle cx="403" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="116" text-anchor="start"><tspan x="413">保留每一次保存的历史记录</tspan></text>
  <circle cx="403" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="146" text-anchor="start"><tspan x="413">历史是系统自动记录的、可以回看和恢复的一串状态</tspan><tspan x="413" dy="18">——官方评价：game changer</tspan></text>
  <rect class="note" x="22" y="194" width="696" height="52" rx="6"/>
  <text class="s" x="370" y="216" text-anchor="middle"><tspan x="370">差别的关键：副本方案里「历史」是一堆自己命名、彼此无关的文件；Git 方案里不需要靠文件名去记「哪一版才是最终</tspan><tspan x="370" dy="18">版」。</tspan></text>
</svg>
