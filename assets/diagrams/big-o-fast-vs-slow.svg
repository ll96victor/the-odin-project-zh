<svg xmlns="http://www.w3.org/2000/svg" width="740" height="280" viewBox="0 0 740 280" role="img" aria-labelledby="t-big-o-fast-vs-slow d-big-o-fast-vs-slow">
  <title id="t-big-o-fast-vs-slow">八个 Big O 记号：快慢两侧的增长形状</title>
  <desc id="d-big-o-fast-vs-slow">两列对比图。左列「快侧：数据翻倍、步数温和」：O(1) 常数——按索引取值永远一步；O(log N)——二分查找每步砍半、数据翻倍步数只加一；O(N) 线性——步数与元素数同速增长；O(N log N)——对半拆加每半线性处理（merge sort）。右列「慢侧：数据翻倍、步数暴涨」：O(n²) 双层循环——3 项 9 步、10 项 100 步；O(n³) 三层循环——10 项 1000 步、100 项一百万；O(2ⁿ) 指数——每加一项步数翻倍、10 项 1024；O(N!) 阶乘——排列组合、10! 等于 3,628,800。图下说明：Big O 度量步数随数据规模怎么变、丢弃常数（O(N/2) 与 O(10N) 都记 O(N)）；但小输入时常数真的有用——官方对照表里 N=1 时 O(n²) 一步反而快过 O(10N) 十步。等级选对，且在等级内尽可能高效。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="22" y="22" width="335" height="170" rx="8"/>
  <path class="divider" d="M22,62 L357,62"/>
  <rect class="head" x="22" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="22" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M22,62 L357,62"/>
  <text class="hb" x="190" y="47" text-anchor="middle"><tspan x="190">快侧 · 数据翻倍步数温和</tspan></text>
  <circle cx="42" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="86" text-anchor="start"><tspan x="52">O(1) 常数：按索引取值永远一步</tspan></text>
  <circle cx="42" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="116" text-anchor="start"><tspan x="52">O(log N)：每步砍半——翻倍只加一步</tspan></text>
  <circle cx="42" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="146" text-anchor="start"><tspan x="52">O(N) 线性：步数与元素同速增长</tspan></text>
  <circle cx="42" cy="172" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="176" text-anchor="start"><tspan x="52">O(N log N)：对半拆 + 每半线性（merge sort）</tspan></text>
  <rect class="box" x="383" y="22" width="335" height="170" rx="8"/>
  <path class="divider" d="M383,62 L718,62"/>
  <rect class="head" x="383" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="383" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M383,62 L718,62"/>
  <text class="hb" x="551" y="47" text-anchor="middle"><tspan x="551">慢侧 · 数据翻倍步数暴涨</tspan></text>
  <circle cx="403" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="86" text-anchor="start"><tspan x="413">O(n²)：双层循环——10 项 100 步</tspan></text>
  <circle cx="403" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="116" text-anchor="start"><tspan x="413">O(n³)：三层循环——100 项一百万步</tspan></text>
  <circle cx="403" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="146" text-anchor="start"><tspan x="413">O(2ⁿ)：每加一项翻倍——10 项 1024 步</tspan></text>
  <circle cx="403" cy="172" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="176" text-anchor="start"><tspan x="413">O(N!)：排列组合——10! = 3,628,800</tspan></text>
  <rect class="note" x="22" y="206" width="696" height="52" rx="6"/>
  <text class="s" x="370" y="228" text-anchor="middle"><tspan x="370">Big O 度量「步数随数据规模怎么变」并丢弃常数（O(N/2) 与 O(10N) 都记 O(N)）——但小输入时常数真的有用：官方</tspan><tspan x="370" dy="18">对照表里 N=1 时 O(n²) 一步反而快过 O(10N) 十步。等级选对，且在等级内尽可能高效。</tspan></text>
</svg>
