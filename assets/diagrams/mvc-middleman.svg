<svg xmlns="http://www.w3.org/2000/svg" width="732" height="448" viewBox="0 0 732 448" role="img" aria-labelledby="t-mvc-middleman d-mvc-middleman">
  <title id="t-mvc-middleman">MVC：控制器是终极中间人</title>
  <desc id="d-mvc-middleman">中心辐射图。中心是控制器（Controller），副题「终极中间人：知道该做什么，把难活全委派出去」。四个卫星节点：模型（Model），数据住在这里——控制器知道问它什么，数据库操作的重活它自己干；视图（View），HTML 在这里拼——控制器决定渲染哪个视图，页面细节视图自己管；路由（Route），请求的入口——动词加路径匹配后把请求交给对应控制器函数；响应（Response），控制器拿着渲染结果经 res 发回浏览器、结束请求循环。图下注：控制器是整场运作的大脑，但它自己不碰数据库、不拼 HTML——MVC 模式里它只是一个职责明确的函数。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #878c87; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <path class="spoke" d="M366,180 L366,96"/>
  <path class="spoke" d="M456,224 L484,224"/>
  <path class="spoke" d="M366,269 L366,352"/>
  <path class="spoke" d="M276,224 L248,224"/>
  <rect class="accentbox" x="276" y="180" width="180" height="89" rx="10"/>
  <text class="hb" x="366" y="213" text-anchor="middle"><tspan x="366">控制器 Controller</tspan></text>
  <text class="s" x="366" y="229" text-anchor="middle"><tspan x="366">终极中间人：知道该做什么，难活全</tspan><tspan x="366" dy="16">委派</tspan></text>
  <rect class="box" x="252" y="20" width="228" height="76" rx="6"/>
  <text class="hb" x="366" y="43" text-anchor="middle"><tspan x="366">模型 Model</tspan></text>
  <text class="s" x="366" y="59" text-anchor="middle"><tspan x="366">数据住这里——控制器知道问什么，数</tspan><tspan x="366" dy="17">据库重活模型自己干</tspan></text>
  <rect class="box" x="484" y="186" width="228" height="76" rx="6"/>
  <text class="hb" x="598" y="209" text-anchor="middle"><tspan x="598">视图 View</tspan></text>
  <text class="s" x="598" y="225" text-anchor="middle"><tspan x="598">HTML 在这里拼——控制器定渲染哪个</tspan><tspan x="598" dy="17">视图，细节视图自己管</tspan></text>
  <rect class="box" x="252" y="352" width="228" height="76" rx="6"/>
  <text class="hb" x="366" y="375" text-anchor="middle"><tspan x="366">路由 Route</tspan></text>
  <text class="s" x="366" y="391" text-anchor="middle"><tspan x="366">请求入口——动词加路径匹配后交给对</tspan><tspan x="366" dy="17">应控制器函数</tspan></text>
  <rect class="box" x="20" y="186" width="228" height="76" rx="6"/>
  <text class="hb" x="134" y="209" text-anchor="middle"><tspan x="134">响应 Response</tspan></text>
  <text class="s" x="134" y="225" text-anchor="middle"><tspan x="134">控制器拿渲染结果经 res 发回浏览</tspan><tspan x="134" dy="17">器、结束循环</tspan></text>
</svg>
