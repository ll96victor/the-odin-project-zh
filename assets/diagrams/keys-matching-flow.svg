<svg xmlns="http://www.w3.org/2000/svg" width="612" height="296" viewBox="0 0 612 296" role="img" aria-labelledby="t-keys-matching-flow d-keys-matching-flow">
  <title id="t-keys-matching-flow">一次重渲染里，key 是怎么配对的</title>
  <desc id="d-keys-matching-flow">流程图，六步。第一步状态或数据变化，触发重渲染；第二步重建虚拟 DOM，组件函数再跑一遍，map 又生成一批元素；第三步新旧对比，React 用 key 把旧列表项与新列表项逐项配对；第四步分叉之一，key 没变的项被认成同一实例，状态延续，只做最小更新；第五步分叉之二，key 变了的项被认成全新实例，带全新状态重建，故意换 key 就是利用这一步做强制重置；第六步把真正变化的部分写进真实 DOM，其余不动。图下注：动态列表的 key 必须唯一且稳定——从数据本身推出（如每项的 id），不在渲染时现场生成，会变的列表慎用数组下标。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #878c87; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="26" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="102" y="55" text-anchor="middle"><tspan x="102">状态/数据变化</tspan></text>
  <text class="s" x="102" y="75" text-anchor="middle"><tspan x="102">触发重渲染</tspan></text>
  <rect class="box" x="230" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="306" y="55" text-anchor="middle"><tspan x="306">重建虚拟 DOM</tspan></text>
  <text class="s" x="306" y="75" text-anchor="middle"><tspan x="306">组件函数再跑一遍</tspan></text>
  <path class="edge" d="M178,57 L223,57" marker-end="url(#arr)"/>
  <rect class="box" x="434" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="510" y="55" text-anchor="middle"><tspan x="510">新旧对比（diff）</tspan></text>
  <text class="s" x="510" y="68" text-anchor="middle"><tspan x="510">列表项按 key</tspan><tspan x="510" dy="15">逐项配 对</tspan></text>
  <path class="edge" d="M382,57 L427,57" marker-end="url(#arr)"/>
  <rect class="box" x="26" y="150" width="152" height="62" rx="6"/>
  <text class="hb" x="102" y="170" text-anchor="middle"><tspan x="102">key 没变 →</tspan><tspan x="102" dy="18">实例保 留</tspan></text>
  <text class="s" x="102" y="199" text-anchor="middle"><tspan x="102">状态延续、最小更新</tspan></text>
  <rect class="box" x="230" y="150" width="152" height="62" rx="6"/>
  <text class="hb" x="306" y="170" text-anchor="middle"><tspan x="306">key 变了 →</tspan><tspan x="306" dy="18">全新实 例</tspan></text>
  <text class="s" x="306" y="192" text-anchor="middle"><tspan x="306">状态清零；故意换 key</tspan><tspan x="306" dy="15">= 强制重开</tspan></text>
  <path class="edge" d="M178,181 L223,181" marker-end="url(#arr)"/>
  <rect class="accentbox" x="434" y="150" width="152" height="62" rx="6"/>
  <text class="hb" x="510" y="179" text-anchor="middle"><tspan x="510">写真实 DOM</tspan></text>
  <text class="s" x="510" y="199" text-anchor="middle"><tspan x="510">只动真正变化的部分</tspan></text>
  <path class="edge" d="M382,181 L427,181" marker-end="url(#arr)"/>
  <path class="edge" d="M510,88 L510,119 L102,119 L102,143" marker-end="url(#arr)"/>
  <rect class="note" x="26" y="218" width="560" height="52" rx="6"/>
  <text class="s" x="306" y="240" text-anchor="middle"><tspan x="306">动态列表的 key 必须唯一且稳定：从数据推出（每项的 id）、不现场生成、会变的列表慎用</tspan><tspan x="306" dy="18">index</tspan></text>
</svg>
