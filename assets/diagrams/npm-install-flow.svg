<svg xmlns="http://www.w3.org/2000/svg" width="519" height="296" viewBox="0 0 519 296" role="img" aria-labelledby="t-npm-install-flow d-npm-install-flow">
  <title id="t-npm-install-flow">npm install 的一趟旅行：从清单到可用的包</title>
  <desc id="d-npm-install-flow">五步流程图。第一步「package.json」：项目清单，存着名字、依赖及版本号。第二步「npm install」：命令行工具读清单。第三步「npm 仓库」：插件、库与工具的巨型仓库，按清单把包下载下来。第四步「node_modules/」：所有已安装包的代码存放在本地，可以 import 进自己的文件。第五步「scripts 就绪」：package.json 里 npm run 的命令能跑了。图下说明：仓库本身不包含依赖代码——谁 clone 谁跑 install，npm 替你把代码抓来；用 npm 装新包或卸载时，它会自动更新 package.json。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #878c87; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="26" y="26" width="121" height="62" rx="6"/>
  <text class="hb" x="87" y="55" text-anchor="middle"><tspan x="87">package.json</tspan></text>
  <text class="s" x="87" y="68" text-anchor="middle"><tspan x="87">清单：依赖名与</tspan><tspan x="87" dy="15">版本号</tspan></text>
  <rect class="box" x="199" y="26" width="121" height="62" rx="6"/>
  <text class="hb" x="260" y="55" text-anchor="middle"><tspan x="260">npm install</tspan></text>
  <text class="s" x="260" y="75" text-anchor="middle"><tspan x="260">命令行工具读清单</tspan></text>
  <path class="edge" d="M147,57 L192,57" marker-end="url(#arr)"/>
  <rect class="box" x="372" y="26" width="121" height="62" rx="6"/>
  <text class="hb" x="433" y="55" text-anchor="middle"><tspan x="433">npm 仓库</tspan></text>
  <text class="s" x="433" y="68" text-anchor="middle"><tspan x="433">巨型仓库按清单</tspan><tspan x="433" dy="15">下载</tspan></text>
  <path class="edge" d="M320,57 L365,57" marker-end="url(#arr)"/>
  <rect class="box" x="26" y="150" width="121" height="62" rx="6"/>
  <text class="hb" x="87" y="179" text-anchor="middle"><tspan x="87">node_modules/</tspan></text>
  <text class="s" x="87" y="192" text-anchor="middle"><tspan x="87">包代码存放本地，</tspan><tspan x="87" dy="15">可 import</tspan></text>
  <rect class="accentbox" x="199" y="150" width="121" height="62" rx="6"/>
  <text class="hb" x="260" y="179" text-anchor="middle"><tspan x="260">scripts 就绪</tspan></text>
  <text class="s" x="260" y="192" text-anchor="middle"><tspan x="260">npm run 的命令</tspan><tspan x="260" dy="15">能跑了</tspan></text>
  <path class="edge" d="M147,181 L192,181" marker-end="url(#arr)"/>
  <path class="edge" d="M433,88 L433,119 L87,119 L87,143" marker-end="url(#arr)"/>
  <rect class="note" x="26" y="218" width="467" height="52" rx="6"/>
  <text class="s" x="260" y="240" text-anchor="middle"><tspan x="260">仓库本身不包含依赖代码——谁 clone 谁跑 install，npm 替你把代码抓来；</tspan><tspan x="260" dy="18">装包 / 卸载时 npm 自动更新 package.json。</tspan></text>
</svg>
