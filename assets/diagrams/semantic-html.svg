<svg xmlns="http://www.w3.org/2000/svg" width="740" height="286" viewBox="0 0 740 286" role="img" aria-labelledby="t-semantic-html d-semantic-html">
  <title id="t-semantic-html">用对标签：语义化 HTML</title>
  <desc id="d-semantic-html">双栏对比图。左栏是用对标签（官方称之为语义化 HTML）：写标签前先想「这段内容是什么」——是段落、标题还是列表，再选对应的标签；搜索引擎靠标签理解页面内容的结构，影响站点在搜索里的排名；依赖屏幕阅读器等辅助技术上网的用户靠标签「听」懂页面，影响可访问性。右栏是用错标签的代价：页面看起来可能一样，但内容的语义丢了；搜索引擎读不懂结构，排名受损；辅助技术无法理解页面，造成访问障碍。底部注释：标签的价值不在让页面上的字好看，而在让所有读页面的「人」和程序都明白这段内容是什么。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="22" y="22" width="335" height="176" rx="8"/>
  <path class="divider" d="M22,62 L357,62"/>
  <rect class="head" x="22" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="22" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M22,62 L357,62"/>
  <text class="hb" x="190" y="47" text-anchor="middle"><tspan x="190">用对标签（语义化 HTML）</tspan></text>
  <circle cx="42" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="86" text-anchor="start"><tspan x="52">写标签前先想「这段内容是什么」：段落、标题还</tspan><tspan x="52" dy="18">是列表</tspan></text>
  <circle cx="42" cy="130" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="134" text-anchor="start"><tspan x="52">搜索引擎靠标签理解页面内容的结构——影响搜索排名</tspan></text>
  <circle cx="42" cy="160" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="164" text-anchor="start"><tspan x="52">屏幕阅读器等辅助技术靠标签「听」懂页面——影响可</tspan><tspan x="52" dy="18">访问性</tspan></text>
  <rect class="box" x="383" y="22" width="335" height="176" rx="8"/>
  <path class="divider" d="M383,62 L718,62"/>
  <rect class="head" x="383" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="383" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M383,62 L718,62"/>
  <text class="hb" x="551" y="47" text-anchor="middle"><tspan x="551">用错标签的代价</tspan></text>
  <circle cx="403" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="86" text-anchor="start"><tspan x="413">页面看起来可能一样，但内容语义丢了</tspan></text>
  <circle cx="403" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="116" text-anchor="start"><tspan x="413">搜索引擎读不懂结构，排名受损</tspan></text>
  <circle cx="403" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="146" text-anchor="start"><tspan x="413">依赖辅助技术的用户无法理解页面</tspan></text>
  <rect class="note" x="22" y="212" width="696" height="52" rx="6"/>
  <text class="s" x="370" y="234" text-anchor="middle"><tspan x="370">标签的价值不在让页面上的字好看，而在让所有读页面的「人」和程序都明白这段内容是什么。这个习惯课程后面会深入</tspan><tspan x="370" dy="18">展开。</tspan></text>
</svg>
