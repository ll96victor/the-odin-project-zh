<svg xmlns="http://www.w3.org/2000/svg" width="612" height="278" viewBox="0 0 612 278" role="img" aria-labelledby="t-prg-pattern d-prg-pattern">
  <title id="t-prg-pattern">PRG 模式：POST 之后必须重定向</title>
  <desc id="d-prg-pattern">流程图，五步折两行。第一步用户提交表单——POST /new 带表单数据；第二步控制器接手处理——与数据库沟通、存入新数据；第三步响应一个重定向——303 跳转到 /；第四步浏览器自动改发 GET /；第五步服务器渲染最新视图——新留言出现在首页。图下注：重定向之后再刷新页面，重放的只是无害的 GET——不会重复插入数据；若 POST 后直接渲染响应，刷新就会重复提交表单。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="26" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="102" y="46" text-anchor="middle"><tspan x="102">提交表单</tspan><tspan x="102" dy="18">POST /new</tspan></text>
  <text class="s" x="102" y="75" text-anchor="middle"><tspan x="102">带表单数据</tspan></text>
  <rect class="box" x="230" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="306" y="55" text-anchor="middle"><tspan x="306">控制器处理</tspan></text>
  <text class="s" x="306" y="75" text-anchor="middle"><tspan x="306">与数据库沟通、存数据</tspan></text>
  <path class="edge" d="M178,57 L223,57" marker-end="url(#arr)"/>
  <rect class="box" x="434" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="510" y="55" text-anchor="middle"><tspan x="510">响应重定向</tspan></text>
  <text class="s" x="510" y="75" text-anchor="middle"><tspan x="510">303 → /</tspan></text>
  <path class="edge" d="M382,57 L427,57" marker-end="url(#arr)"/>
  <rect class="box" x="26" y="150" width="152" height="62" rx="6"/>
  <text class="hb" x="102" y="179" text-anchor="middle"><tspan x="102">浏览器改发 GET /</tspan></text>
  <text class="s" x="102" y="199" text-anchor="middle"><tspan x="102">自动跟随</tspan></text>
  <rect class="accentbox" x="230" y="150" width="152" height="62" rx="6"/>
  <text class="hb" x="306" y="179" text-anchor="middle"><tspan x="306">渲染最新视图</tspan></text>
  <text class="s" x="306" y="199" text-anchor="middle"><tspan x="306">新留言上首页</tspan></text>
  <path class="edge" d="M178,181 L223,181" marker-end="url(#arr)"/>
  <path class="edge" d="M510,88 L510,119 L102,119 L102,143" marker-end="url(#arr)"/>
  <rect class="note" x="26" y="218" width="560" height="34" rx="6"/>
  <text class="s" x="306" y="240" text-anchor="middle"><tspan x="306">重定向后刷新只重放无害的 GET——不重复插数据；POST 后直接渲染的话，刷新就是重复提交。</tspan></text>
</svg>
