<svg xmlns="http://www.w3.org/2000/svg" width="628" height="154" viewBox="0 0 628 154" role="img" aria-labelledby="t-cascade-decision-order d-cascade-decision-order">
  <title id="t-cascade-decision-order">层叠的判定顺序</title>
  <desc id="d-cascade-decision-order">四步流程图，依次回答四个问题来确定多条冲突的 CSS 规则里哪一条生效。第一步：这条规则是直接命中该元素，还是从祖先继承来的？直接命中永远赢过继承。第二步：都比选择器类型——ID 选择器胜过任意数量的类选择器，类选择器胜过任意数量的类型选择器。第三步：类型上打平时比同类选择器的数量，数量多的赢。第四步：仍然分不出胜负时比规则顺序，写在后面的那条生效。底部注释：通配选择器与组合器符号本身不贡献任何特异性，浏览器的默认样式也参与比较，但权重通常很低。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="26" y="26" width="105" height="62" rx="6"/>
  <text class="hb" x="79" y="55" text-anchor="middle"><tspan x="79">直接命中</tspan></text>
  <text class="s" x="79" y="60" text-anchor="middle"><tspan x="79">直接命中的规</tspan><tspan x="79" dy="15">则赢过继承</tspan><tspan x="79" dy="15">来的值</tspan></text>
  <rect class="box" x="183" y="26" width="105" height="62" rx="6"/>
  <text class="hb" x="236" y="55" text-anchor="middle"><tspan x="236">比选择器类型</tspan></text>
  <text class="s" x="236" y="53" text-anchor="middle"><tspan x="236">ID 胜过任意数</tspan><tspan x="236" dy="15">量的类，类胜</tspan><tspan x="236" dy="15">过任意数量</tspan><tspan x="236" dy="15">的类型</tspan></text>
  <path class="edge" d="M131,57 L176,57" marker-end="url(#arr)"/>
  <rect class="box" x="340" y="26" width="105" height="62" rx="6"/>
  <text class="hb" x="393" y="55" text-anchor="middle"><tspan x="393">比同类数量</tspan></text>
  <text class="s" x="393" y="60" text-anchor="middle"><tspan x="393">类型打平时，</tspan><tspan x="393" dy="15">同类选择器</tspan><tspan x="393" dy="15">多的赢</tspan></text>
  <path class="edge" d="M288,57 L333,57" marker-end="url(#arr)"/>
  <rect class="accentbox" x="497" y="26" width="105" height="62" rx="6"/>
  <text class="hb" x="550" y="55" text-anchor="middle"><tspan x="550">比规则顺序</tspan></text>
  <text class="s" x="550" y="60" text-anchor="middle"><tspan x="550">仍分不出胜负</tspan><tspan x="550" dy="15">时，写在后面</tspan><tspan x="550" dy="15">的那条生效</tspan></text>
  <path class="edge" d="M445,57 L490,57" marker-end="url(#arr)"/>
  <rect class="note" x="26" y="94" width="576" height="34" rx="6"/>
  <text class="s" x="314" y="116" text-anchor="middle"><tspan x="314">通配选择器与组合器符号本身不贡献特异性；浏览器的默认样式也参与比较，但权重通常很低。</tspan></text>
</svg>
