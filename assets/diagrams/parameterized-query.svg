<svg xmlns="http://www.w3.org/2000/svg" width="740" height="280" viewBox="0 0 740 280" role="img" aria-labelledby="t-parameterized-query d-parameterized-query">
  <title id="t-parameterized-query">参数化查询：数据与指令分家</title>
  <desc id="d-parameterized-query">两列对比图。左列字符串拼接（危险写法）：用户输入直接拼进 SQL 字符串；输入混进指令、成为 SQL 的一部分；输入 sike 单引号分号 DROP TABLE usernames 分号双双减号就能把整张表删掉；这就是 SQL 注入。右列参数化查询（pg 的解法）：SQL 结构先定死——VALUES ($1) 占位；用户输入放进数组作为 query 的第二个参数；$1 永远是数据、不可能变成指令；转义与类型处理由 pg 代劳。图下注：与表单课「转义在输出处做」同一总纲——数据与指令的边界必须有人守，参数化就是数据库这一侧的守门人。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #878c87; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="22" y="22" width="335" height="188" rx="8"/>
  <path class="divider" d="M22,62 L357,62"/>
  <rect class="head" x="22" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="22" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M22,62 L357,62"/>
  <text class="hb" x="190" y="47" text-anchor="middle"><tspan x="190">字符串拼接（危险）</tspan></text>
  <circle cx="42" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="86" text-anchor="start"><tspan x="52">用户输入直接拼进 SQL 字符串</tspan></text>
  <circle cx="42" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="116" text-anchor="start"><tspan x="52">输入混进指令、成为 SQL 的一部分</tspan></text>
  <circle cx="42" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="146" text-anchor="start"><tspan x="52">输入 sike'); DROP TABLE usernames; -- 整张</tspan><tspan x="52" dy="18">表被删</tspan></text>
  <circle cx="42" cy="190" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="194" text-anchor="start"><tspan x="52">这就是 SQL 注入</tspan></text>
  <rect class="box" x="383" y="22" width="335" height="188" rx="8"/>
  <path class="divider" d="M383,62 L718,62"/>
  <rect class="head" x="383" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="383" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M383,62 L718,62"/>
  <text class="hb" x="551" y="47" text-anchor="middle"><tspan x="551">参数化查询（pg 解法）</tspan></text>
  <circle cx="403" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="86" text-anchor="start"><tspan x="413">SQL 结构先定死：VALUES ($1) 占位</tspan></text>
  <circle cx="403" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="116" text-anchor="start"><tspan x="413">输入放进数组作 query 第二参数</tspan></text>
  <circle cx="403" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="146" text-anchor="start"><tspan x="413">$1 永远是数据、不可能变成指令</tspan></text>
  <circle cx="403" cy="172" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="176" text-anchor="start"><tspan x="413">转义与类型处理由 pg 代劳</tspan></text>
  <rect class="note" x="22" y="224" width="696" height="34" rx="6"/>
  <text class="s" x="370" y="246" text-anchor="middle"><tspan x="370">与表单课「转义在输出处做」同一总纲：数据与指令的边界必须有人守——参数化是数据库这侧的守门人。</tspan></text>
</svg>
