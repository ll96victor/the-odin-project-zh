<svg xmlns="http://www.w3.org/2000/svg" width="450" height="348" viewBox="0 0 450 348" role="img" aria-labelledby="t-recursion-dive-and-unwind d-recursion-dive-and-unwind">
  <title id="t-recursion-dive-and-unwind">递归的下潜与上浮：整条链怎么展开</title>
  <desc id="d-recursion-dive-and-unwind">五步流程图。第一步「大问题」：原始调用。第二步「拆解下潜」：函数调用自己、把更小的子问题传下去。第三步「触底」：base case——子问题小到可以直接解决。第四步「上浮组合」：每层把子问题的解组合起来、返回给上一层。第五步「顶层答案」：整条链展开完毕、原问题得解。图下说明：官方定义——递归就是函数调用自己的想法，把大问题拆成越来越小的块（分而治之），把子解持续喂回原函数，直到得出答案、整条链展开；每层调用占一帧调用栈，深度失控就是 stack overflow（Assignment 第 1 条的 javascript.info 文章展开）。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #878c87; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="26" y="26" width="98" height="62" rx="6"/>
  <text class="hb" x="75" y="55" text-anchor="middle"><tspan x="75">大问题</tspan></text>
  <text class="s" x="75" y="75" text-anchor="middle"><tspan x="75">原始调用进来</tspan></text>
  <rect class="box" x="176" y="26" width="98" height="62" rx="6"/>
  <text class="hb" x="225" y="55" text-anchor="middle"><tspan x="225">拆解下潜</tspan></text>
  <text class="s" x="225" y="68" text-anchor="middle"><tspan x="225">函数调用自己</tspan><tspan x="225" dy="15">· 子问题更小</tspan></text>
  <path class="edge" d="M124,57 L169,57" marker-end="url(#arr)"/>
  <rect class="box" x="326" y="26" width="98" height="62" rx="6"/>
  <text class="hb" x="375" y="55" text-anchor="middle"><tspan x="375">触底</tspan></text>
  <text class="s" x="375" y="68" text-anchor="middle"><tspan x="375">base case：</tspan><tspan x="375" dy="15">小到直接可解</tspan></text>
  <path class="edge" d="M274,57 L319,57" marker-end="url(#arr)"/>
  <rect class="box" x="26" y="150" width="98" height="62" rx="6"/>
  <text class="hb" x="75" y="179" text-anchor="middle"><tspan x="75">上浮组合</tspan></text>
  <text class="s" x="75" y="192" text-anchor="middle"><tspan x="75">每层组合子解</tspan><tspan x="75" dy="15">· 返回上层</tspan></text>
  <rect class="accentbox" x="176" y="150" width="98" height="62" rx="6"/>
  <text class="hb" x="225" y="179" text-anchor="middle"><tspan x="225">顶层答案</tspan></text>
  <text class="s" x="225" y="192" text-anchor="middle"><tspan x="225">整条链展开 ·</tspan><tspan x="225" dy="15">原问题得解</tspan></text>
  <path class="edge" d="M124,181 L169,181" marker-end="url(#arr)"/>
  <path class="edge" d="M375,88 L375,119 L75,119 L75,143" marker-end="url(#arr)"/>
  <rect class="note" x="26" y="218" width="398" height="104" rx="6"/>
  <text class="s" x="225" y="240" text-anchor="middle"><tspan x="225">官方定义：递归就是函数调用自己的想法——把大问题拆成越来越小</tspan><tspan x="225" dy="18">的块（分而治之），把子解持续喂回原函数，直到得出答案、整条</tspan><tspan x="225" dy="18">链展开。每层调用占一帧调用栈：深度失控就是 stack overflow</tspan><tspan x="225" dy="18">（Assignment 第 1 条 javascript.info 文章展开，中文官方</tspan><tspan x="225" dy="18">版在位）。</tspan></text>
</svg>
