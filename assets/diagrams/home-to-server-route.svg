<svg xmlns="http://www.w3.org/2000/svg" width="450" height="296" viewBox="0 0 450 296" role="img" aria-labelledby="t-home-to-server-route d-home-to-server-route">
  <title id="t-home-to-server-route">数据包从你家到目标服务器的路径</title>
  <desc id="d-home-to-server-route">分两行排列的流程图。第一行从左到右：你家设备（数据包出发）、家用路由器（决定下一跳）、ISP 运营商（接入互联网）；随后折向第二行：沿途路由器（逐跳接力转发）、目标服务器（收到请求）。方框之间用箭头连接，底部注释说明：网络上每台设备都靠 IP 地址定位，就像寄快递要写收件地址；路由器像一个个路口，只看数据包上的目标地址决定下一跳往哪边走。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="26" y="26" width="98" height="62" rx="6"/>
  <text class="hb" x="75" y="55" text-anchor="middle"><tspan x="75">你家设备</tspan></text>
  <text class="s" x="75" y="75" text-anchor="middle"><tspan x="75">数据包出发</tspan></text>
  <rect class="box" x="176" y="26" width="98" height="62" rx="6"/>
  <text class="hb" x="225" y="55" text-anchor="middle"><tspan x="225">家用路由器</tspan></text>
  <text class="s" x="225" y="75" text-anchor="middle"><tspan x="225">决定下一跳</tspan></text>
  <path class="edge" d="M124,57 L169,57" marker-end="url(#arr)"/>
  <rect class="box" x="326" y="26" width="98" height="62" rx="6"/>
  <text class="hb" x="375" y="55" text-anchor="middle"><tspan x="375">ISP 运营商</tspan></text>
  <text class="s" x="375" y="75" text-anchor="middle"><tspan x="375">接入互联网</tspan></text>
  <path class="edge" d="M274,57 L319,57" marker-end="url(#arr)"/>
  <rect class="box" x="26" y="150" width="98" height="62" rx="6"/>
  <text class="hb" x="75" y="179" text-anchor="middle"><tspan x="75">沿途路由器</tspan></text>
  <text class="s" x="75" y="199" text-anchor="middle"><tspan x="75">逐跳接力转发</tspan></text>
  <rect class="accentbox" x="176" y="150" width="98" height="62" rx="6"/>
  <text class="hb" x="225" y="179" text-anchor="middle"><tspan x="225">目标服务器</tspan></text>
  <text class="s" x="225" y="199" text-anchor="middle"><tspan x="225">收到请求</tspan></text>
  <path class="edge" d="M124,181 L169,181" marker-end="url(#arr)"/>
  <path class="edge" d="M375,88 L375,119 L75,119 L75,143" marker-end="url(#arr)"/>
  <rect class="note" x="26" y="218" width="398" height="52" rx="6"/>
  <text class="s" x="225" y="240" text-anchor="middle"><tspan x="225">网络上每台设备都靠 IP 地址定位——就像寄快递要写收件地址；路</tspan><tspan x="225" dy="18">由器像一个个路口，只看数据包上的目标地址决定下一跳往哪边走。</tspan></text>
</svg>
