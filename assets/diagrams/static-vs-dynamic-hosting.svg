<svg xmlns="http://www.w3.org/2000/svg" width="740" height="298" viewBox="0 0 740 298" role="img" aria-labelledby="t-static-vs-dynamic-hosting d-static-vs-dynamic-hosting">
  <title id="t-static-vs-dynamic-hosting">静态托管 vs 动态托管：发文件还是跑程序</title>
  <desc id="d-static-vs-dynamic-hosting">两列对比图。左列静态网站：预先写好的 HTML 页面；每个访问者看到相同内容；只需要 HTML、CSS、JavaScript；GitHub Pages、Netlify、Vercel 就能托管。右列动态网站：内容随访问用户变化——X 的首页时间线因人而异；额外需要服务端应用与数据库；Pages、Netlify、Vercel 跑不了 Node 服务器、没有数据库服务；要用 PaaS（Railway、Render）或云厂商（AWS、Google Cloud、Azure）。图下注：托管选型只问一个问题——网站需不需要「跑程序」？发文件就够的走静态托管，要跑 Node 加数据库的走 PaaS。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="22" y="22" width="335" height="206" rx="8"/>
  <path class="divider" d="M22,62 L357,62"/>
  <rect class="head" x="22" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="22" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M22,62 L357,62"/>
  <text class="hb" x="190" y="47" text-anchor="middle"><tspan x="190">静态网站（发文件）</tspan></text>
  <circle cx="42" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="86" text-anchor="start"><tspan x="52">预先写好的 HTML 页面</tspan></text>
  <circle cx="42" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="116" text-anchor="start"><tspan x="52">每个访问者看到相同内容</tspan></text>
  <circle cx="42" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="146" text-anchor="start"><tspan x="52">只需 HTML / CSS / JavaScript</tspan></text>
  <circle cx="42" cy="172" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="176" text-anchor="start"><tspan x="52">GitHub Pages、Netlify、Vercel 就能托管</tspan></text>
  <rect class="box" x="383" y="22" width="335" height="206" rx="8"/>
  <path class="divider" d="M383,62 L718,62"/>
  <rect class="head" x="383" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="383" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M383,62 L718,62"/>
  <text class="hb" x="551" y="47" text-anchor="middle"><tspan x="551">动态网站（跑程序）</tspan></text>
  <circle cx="403" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="86" text-anchor="start"><tspan x="413">内容随访问用户变化——X 时间线因人而异</tspan></text>
  <circle cx="403" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="116" text-anchor="start"><tspan x="413">额外需要服务端应用与数据库</tspan></text>
  <circle cx="403" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="146" text-anchor="start"><tspan x="413">Pages / Netlify / Vercel 跑不了 Node、没有</tspan><tspan x="413" dy="18">数据库</tspan></text>
  <circle cx="403" cy="190" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="194" text-anchor="start"><tspan x="413">要用 PaaS（Railway / Render）或云厂商（AWS</tspan><tspan x="413" dy="18">/ GCP / Azure）</tspan></text>
  <rect class="note" x="22" y="242" width="696" height="34" rx="6"/>
  <text class="s" x="370" y="264" text-anchor="middle"><tspan x="370">托管选型只问一个问题：网站需不需要「跑程序」？发文件就够走静态托管，要跑 Node 加数据库走 PaaS。</tspan></text>
</svg>
