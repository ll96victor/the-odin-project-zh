<svg xmlns="http://www.w3.org/2000/svg" width="612" height="296" viewBox="0 0 612 296" role="img" aria-labelledby="t-express-request-journey d-express-request-journey">
  <title id="t-express-request-journey">一个请求在 Express 里的旅程</title>
  <desc id="d-express-request-journey">流程图，六步折两行。第一步浏览器发 GET / 请求；第二步 Express 把请求包进 request 对象；第三步请求穿过中间件函数链；第四步第一个动词与路径都匹配的路由接手；第五步 req 与 res 作为第一、二参数传进回调；第六步 res.send 发出响应、请求-响应循环结束。图下注：路由顺序很重要——Express 把请求交给第一个匹配动词与路径的路由，后面的同形路由永远轮不到。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #878c87; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="26" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="102" y="55" text-anchor="middle"><tspan x="102">浏览器发 GET /</tspan></text>
  <text class="s" x="102" y="75" text-anchor="middle"><tspan x="102">地址栏导航的本质</tspan></text>
  <rect class="box" x="230" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="306" y="55" text-anchor="middle"><tspan x="306">包进 request 对象</tspan></text>
  <text class="s" x="306" y="75" text-anchor="middle"><tspan x="306">Express 收请求</tspan></text>
  <path class="edge" d="M178,57 L223,57" marker-end="url(#arr)"/>
  <rect class="box" x="434" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="510" y="55" text-anchor="middle"><tspan x="510">穿过中间件链</tspan></text>
  <text class="s" x="510" y="75" text-anchor="middle"><tspan x="510">逐环处理或放行</tspan></text>
  <path class="edge" d="M382,57 L427,57" marker-end="url(#arr)"/>
  <rect class="box" x="26" y="150" width="152" height="62" rx="6"/>
  <text class="hb" x="102" y="170" text-anchor="middle"><tspan x="102">第一个匹配的路由</tspan><tspan x="102" dy="18">接手</tspan></text>
  <text class="s" x="102" y="199" text-anchor="middle"><tspan x="102">动词 + 路径双检查</tspan></text>
  <rect class="box" x="230" y="150" width="152" height="62" rx="6"/>
  <text class="hb" x="306" y="170" text-anchor="middle"><tspan x="306">req / res</tspan><tspan x="306" dy="18">传进回 调</tspan></text>
  <text class="s" x="306" y="199" text-anchor="middle"><tspan x="306">第一、二参数</tspan></text>
  <path class="edge" d="M178,181 L223,181" marker-end="url(#arr)"/>
  <rect class="accentbox" x="434" y="150" width="152" height="62" rx="6"/>
  <text class="hb" x="510" y="179" text-anchor="middle"><tspan x="510">res.send 结束循环</tspan></text>
  <text class="s" x="510" y="199" text-anchor="middle"><tspan x="510">浏览器收到响应</tspan></text>
  <path class="edge" d="M382,181 L427,181" marker-end="url(#arr)"/>
  <path class="edge" d="M510,88 L510,119 L102,119 L102,143" marker-end="url(#arr)"/>
  <rect class="note" x="26" y="218" width="560" height="52" rx="6"/>
  <text class="s" x="306" y="240" text-anchor="middle"><tspan x="306">路由顺序很重要：Express</tspan><tspan x="306" dy="18">把请求交给第一个匹配动词与路径的路由——后面的同形路由永远轮不 到。</tspan></text>
</svg>
