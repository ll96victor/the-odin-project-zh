<svg xmlns="http://www.w3.org/2000/svg" width="732" height="483" viewBox="0 0 732 483" role="img" aria-labelledby="t-ssh-key-pair d-ssh-key-pair">
  <title id="t-ssh-key-pair">SSH 密钥对：私钥和公钥各去哪里</title>
  <desc id="d-ssh-key-pair">概念关系图。中心是 SSH 密钥对——一个密码学上安全的标识符，像一个用来标识你这台机器的超长密码；GitHub 用它允许你上传到仓库，而不必每次输入用户名和密码。周围五个卫星：私钥 id_ed25519——留在你自己电脑上，绝不交给任何人，passphrase 口令短语用来加密它，不用口令短语则任何能访问你电脑的人都能修改你所有的 GitHub 仓库；公钥 id_ed25519.pub——交给 GitHub，GitHub 用它认出你这台机器；生成命令 ssh-keygen -t ed25519——提示保存位置时直接按 Enter，口令短语愿意就设但不是必需；先检查是否已有——ls ~/.ssh/id_ed25519.pub，出现 No such file or directory 才需要新建；多台机器多对密钥——GitHub 允许一个账号关联多个密钥对，每台机器再按说明设置一对。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <path class="spoke" d="M366,205 L366,105"/>
  <path class="spoke" d="M456,219 L473,215"/>
  <path class="spoke" d="M401,278 L458,337"/>
  <path class="spoke" d="M331,278 L274,337"/>
  <path class="spoke" d="M276,219 L259,215"/>
  <rect class="accentbox" x="276" y="205" width="180" height="73" rx="10"/>
  <text class="hb" x="366" y="239" text-anchor="middle"><tspan x="366">SSH 密钥对</tspan></text>
  <text class="s" x="366" y="255" text-anchor="middle"><tspan x="366">标识你这台机器的「超长密码」</tspan></text>
  <rect class="box" x="252" y="29" width="228" height="76" rx="6"/>
  <text class="hb" x="366" y="51" text-anchor="middle"><tspan x="366">私钥 id_ed25519</tspan></text>
  <text class="s" x="366" y="67" text-anchor="middle"><tspan x="366">留在你自己电脑上，绝不交给任何人；</tspan><tspan x="366" dy="17">passphrase 用来加密它</tspan></text>
  <rect class="box" x="473" y="149" width="228" height="76" rx="6"/>
  <text class="hb" x="587" y="172" text-anchor="middle"><tspan x="587">公钥 id_ed25519.pub</tspan></text>
  <text class="s" x="587" y="188" text-anchor="middle"><tspan x="587">交给 GitHub（下一步），GitHub</tspan><tspan x="587" dy="17">用它认出你这台机器、允许上传</tspan></text>
  <rect class="box" x="388" y="337" width="228" height="93" rx="6"/>
  <text class="hb" x="502" y="359" text-anchor="middle"><tspan x="502">ssh-keygen -t ed25519</tspan></text>
  <text class="s" x="502" y="375" text-anchor="middle"><tspan x="502">生成密钥对的命令；保存位置直接按</tspan><tspan x="502" dy="17">Enter；passphrase 愿意就设，不</tspan><tspan x="502" dy="17">是必需</tspan></text>
  <rect class="box" x="116" y="337" width="228" height="93" rx="6"/>
  <text class="hb" x="230" y="359" text-anchor="middle"><tspan x="230">先检查是否已有</tspan></text>
  <text class="s" x="230" y="375" text-anchor="middle"><tspan x="230">ls ~/.ssh/id_ed25519.pub：出现</tspan><tspan x="230" dy="17">No such file or directory 才需</tspan><tspan x="230" dy="17">要新建</tspan></text>
  <rect class="box" x="31" y="149" width="228" height="76" rx="6"/>
  <text class="hb" x="145" y="172" text-anchor="middle"><tspan x="145">多台机器多对密钥</tspan></text>
  <text class="s" x="145" y="188" text-anchor="middle"><tspan x="145">GitHub 允许一个账号关联多个密钥</tspan><tspan x="145" dy="17">对；每台机器单独设置一对</tspan></text>
</svg>
