<svg xmlns="http://www.w3.org/2000/svg" width="720" height="523" viewBox="0 0 720 523" role="img" aria-labelledby="t-problem-solving-loop d-problem-solving-loop">
  <title id="t-problem-solving-loop">官方的「解决问题步骤」：总是回到练习的循环</title>
  <desc id="d-problem-solving-loop">五节点循环图，首尾相接：做这一课；练习这个概念；不知道怎么解决时先研究和试验；研究过仍没头绪时寻求指导；拿到指导后判断它讲不讲得通——讲得通回到练习这个概念，讲不通回到重做这一课。底部注释指出：不管走哪个分支，最终都会回到「练习这个概念」；这套流程的真正用意是防止你在「重看课程」和「直接放弃」之间二选一，它总是把你推回动手。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <path class="edge" d="M408,85 Q440,148 535,150" marker-end="url(#arr)"/>
  <path class="edge" d="M575,201 Q494,254 516,329" marker-end="url(#arr)"/>
  <path class="edge" d="M440,364 Q360,326 279,364" marker-end="url(#arr)"/>
  <path class="edge" d="M205,331 Q228,259 150,211" marker-end="url(#arr)"/>
  <path class="edge" d="M198,143 Q283,146 308,87" marker-end="url(#arr)"/>
  <rect class="box" x="308" y="40" width="104" height="41" rx="6"/>
  <text class="b" x="360" y="65" text-anchor="middle"><tspan x="360">① 做这一课</tspan></text>
  <rect class="box" x="525" y="156" width="122" height="41" rx="6"/>
  <text class="b" x="586" y="181" text-anchor="middle"><tspan x="586">② 练习这个概念</tspan></text>
  <rect class="box" x="445" y="335" width="109" height="58" rx="6"/>
  <text class="hb" x="500" y="360" text-anchor="middle"><tspan x="500">③ 研究和试验</tspan></text>
  <text class="s" x="500" y="383" text-anchor="middle"><tspan x="500">不知道怎么解决时</tspan></text>
  <rect class="box" x="168" y="335" width="104" height="58" rx="6"/>
  <text class="hb" x="220" y="360" text-anchor="middle"><tspan x="220">④ 寻求指导</tspan></text>
  <text class="s" x="220" y="376" text-anchor="middle"><tspan x="220">研究过仍没头</tspan><tspan x="220" dy="14">绪时</tspan></text>
  <rect class="box" x="73" y="147" width="122" height="58" rx="6"/>
  <text class="hb" x="134" y="172" text-anchor="middle"><tspan x="134">⑤ 指导讲得通吗</tspan></text>
  <text class="s" x="134" y="188" text-anchor="middle"><tspan x="134">讲通回练习；不通重</tspan><tspan x="134" dy="14">做本课</tspan></text>
  <rect class="note" x="26" y="445" width="668" height="52" rx="6"/>
  <text class="s" x="360" y="467" text-anchor="middle"><tspan x="360">不管走哪个分支，最终都回到「练习这个概念」。这套流程防止你在「重看课程」和「直接放弃」之间二选一——它总</tspan><tspan x="360" dy="18">是把你推回动手。</tspan></text>
</svg>
