<svg xmlns="http://www.w3.org/2000/svg" width="740" height="316" viewBox="0 0 740 316" role="img" aria-labelledby="t-testing-query-families d-testing-query-families">
  <title id="t-testing-query-families">RTL 查询两个维度：前缀定行为，ByX 定抓手</title>
  <desc id="d-testing-query-families">左右两列对照图。左列是前缀三家族（找不到元素时的行为）：getBy，找不到立即抛错——找「应该在」的元素用它；queryBy，找不到返回 null 不抛错——断言「不该在」的元素只能用它；findBy，返回 Promise 异步等待元素出现——等延迟渲染的内容。右列是 ByX 抓手（按什么找元素，官方优先级从高到低）：ByRole 首选，按 ARIA 角色配 name 选项，天然校验可访问性；ByLabelText 与 ByPlaceholderText，表单元素专用；ByText 按可见文本；ByAltText 与 ByTitle，图片与提示文本；ByTestId 垫底，前几种都不可用时的逃生舱。图下注：一次查询等于前缀乘 ByX 的组合，如 getByRole、findByText——先想用户怎么感知元素选 ByX，再想元素该不该在选前缀。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #878c87; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="22" y="22" width="335" height="224" rx="8"/>
  <path class="divider" d="M22,62 L357,62"/>
  <rect class="head" x="22" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="22" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M22,62 L357,62"/>
  <text class="hb" x="190" y="47" text-anchor="middle"><tspan x="190">前缀三家族：找不到时的行为</tspan></text>
  <circle cx="42" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="86" text-anchor="start"><tspan x="52">getBy…：找不到立即抛错——找「应该在」的元素</tspan></text>
  <circle cx="42" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="116" text-anchor="start"><tspan x="52">queryBy…：找不到返回 null——断言「不该在」只</tspan><tspan x="52" dy="18">能用它</tspan></text>
  <circle cx="42" cy="160" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="164" text-anchor="start"><tspan x="52">findBy…：返回 Promise 异步等待——等延迟渲染的</tspan><tspan x="52" dy="18">内容（要 await）</tspan></text>
  <rect class="box" x="383" y="22" width="335" height="224" rx="8"/>
  <path class="divider" d="M383,62 L718,62"/>
  <rect class="head" x="383" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="383" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M383,62 L718,62"/>
  <text class="hb" x="551" y="47" text-anchor="middle"><tspan x="551">ByX 抓手：官方优先级从高到低</tspan></text>
  <circle cx="403" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="86" text-anchor="start"><tspan x="413">ByRole 首选：按 ARIA 角色配 name——天然校验可</tspan><tspan x="413" dy="18">访问性</tspan></text>
  <circle cx="403" cy="130" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="134" text-anchor="start"><tspan x="413">ByLabelText /</tspan><tspan x="413" dy="18">ByPlaceholderText：表单元素专 用</tspan></text>
  <circle cx="403" cy="178" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="182" text-anchor="start"><tspan x="413">ByText：按可见文本；ByAltText / ByTitle：图</tspan><tspan x="413" dy="18">片与提示</tspan></text>
  <circle cx="403" cy="226" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="230" text-anchor="start"><tspan x="413">ByTestId 垫底：前几种都不可用时的逃生舱</tspan></text>
  <rect class="note" x="22" y="260" width="696" height="34" rx="6"/>
  <text class="s" x="370" y="282" text-anchor="middle"><tspan x="370">一次查询 = 前缀 × ByX（如 getByRole、findByText）：先想用户怎么感知选 ByX，再想该不该在选前缀</tspan></text>
</svg>
