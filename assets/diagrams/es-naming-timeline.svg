<svg xmlns="http://www.w3.org/2000/svg" width="585" height="313" viewBox="0 0 585 313" role="img" aria-labelledby="t-es-naming-timeline d-es-naming-timeline">
  <title id="t-es-naming-timeline">ECMAScript 命名与发布时间线：从攒大招到每年一版</title>
  <desc id="d-es-naming-timeline">五步流程时间线。第一步「ES5 及以前」：版本号命名、攒大招式发布。第二步「ES6 = ES2015」：2015 年夏发布，TC39 委员会改用年份命名。第三步「ES2016 起」：有人叫它 ES7，从此每年一版。第四步「每版少量新增」：特性细水长流进来。第五步「widely available」：新特性到主流浏览器普遍支持常滞后几年，必要时用 Babel 按 targets 转译。图下说明：「ES+数字」与「ES+年份」是同一条时间线的两套叫法；个人开发的自动更新浏览器感知不到滞后，面向公众的产品要查支持状态。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="26" y="26" width="143" height="62" rx="6"/>
  <text class="hb" x="98" y="55" text-anchor="middle"><tspan x="98">ES5 及以前</tspan></text>
  <text class="s" x="98" y="68" text-anchor="middle"><tspan x="98">版本号命名 · 攒大招</tspan><tspan x="98" dy="15">式发布</tspan></text>
  <rect class="box" x="221" y="26" width="143" height="62" rx="6"/>
  <text class="hb" x="293" y="55" text-anchor="middle"><tspan x="293">ES6 = ES2015</tspan></text>
  <text class="s" x="293" y="68" text-anchor="middle"><tspan x="293">2015 年夏 · TC39</tspan><tspan x="293" dy="15">改用年份命名</tspan></text>
  <path class="edge" d="M169,57 L214,57" marker-end="url(#arr)"/>
  <rect class="box" x="416" y="26" width="143" height="62" rx="6"/>
  <text class="hb" x="488" y="55" text-anchor="middle"><tspan x="488">ES2016 起</tspan></text>
  <text class="s" x="488" y="68" text-anchor="middle"><tspan x="488">有人叫 ES7 ·</tspan><tspan x="488" dy="15">每年一 版</tspan></text>
  <path class="edge" d="M364,57 L409,57" marker-end="url(#arr)"/>
  <rect class="box" x="26" y="150" width="143" height="62" rx="6"/>
  <text class="hb" x="98" y="179" text-anchor="middle"><tspan x="98">每版少量新增</tspan></text>
  <text class="s" x="98" y="199" text-anchor="middle"><tspan x="98">特性细水长流进来</tspan></text>
  <rect class="accentbox" x="221" y="150" width="143" height="62" rx="6"/>
  <text class="hb" x="293" y="179" text-anchor="middle"><tspan x="293">widely available</tspan></text>
  <text class="s" x="293" y="192" text-anchor="middle"><tspan x="293">常滞后几年 · 必要时</tspan><tspan x="293" dy="15">Babel 转译</tspan></text>
  <path class="edge" d="M169,181 L214,181" marker-end="url(#arr)"/>
  <path class="edge" d="M488,88 L488,119 L98,119 L98,143" marker-end="url(#arr)"/>
  <rect class="note" x="26" y="218" width="533" height="69" rx="6"/>
  <text class="s" x="293" y="240" text-anchor="middle"><tspan x="293">「ES+数字」与「ES+年份」是同一条时间线的两套叫法。新特性从定稿到主流浏览器普遍支</tspan><tspan x="293" dy="18">持常要几年——个人开发的自动更新浏览器感知不到，面向公众的产品要查支持状态（Babel</tspan><tspan x="293" dy="18">按 targets 转译）。</tspan></text>
</svg>
