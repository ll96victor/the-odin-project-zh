<svg xmlns="http://www.w3.org/2000/svg" width="760" height="299" viewBox="0 0 760 299" role="img" aria-labelledby="t-box-model-four-layers d-box-model-four-layers">
  <title id="t-box-model-four-layers">盒模型的四层：由内到外</title>
  <desc id="d-box-model-four-layers">解剖图。主体横条从左到右四段，把一个元素盒子从内到外切开：第一段 content（内容）——装文字与图片的那一层，width / height 默认只量它；第二段 padding（内边距）——边框与内容之间的空间，把内容往里撑；第三段 border（边框）——包住 padding 与内容的一道框，哪怕只有一两个像素也占地方；第四段 margin（外边距）——盒子的边框与相邻盒子的边框之间的空间，把别的盒子推开。底部注释：布局一个网页，本质上就是在决定这些盒子怎样嵌套、怎样堆叠。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="chip" x="120" y="24" width="147" height="38" rx="6"/>
  <text class="b" x="193" y="48" text-anchor="middle"><tspan x="193">一切皆矩形盒</tspan></text>
  <rect class="chip" x="307" y="24" width="147" height="38" rx="6"/>
  <text class="b" x="380" y="48" text-anchor="middle"><tspan x="380">四层由内到外叠加</tspan></text>
  <path class="edge" d="M271,43 L300,43" marker-end="url(#arr)"/>
  <rect class="chip" x="494" y="24" width="147" height="38" rx="6"/>
  <text class="b" x="567" y="48" text-anchor="middle"><tspan x="567">布局就是安排这些盒子</tspan></text>
  <path class="edge" d="M458,43 L487,43" marker-end="url(#arr)"/>
  <text class="h" x="380" y="117" text-anchor="middle"><tspan x="380">一个元素盒子（box model）</tspan></text>
  <rect class="accentbox" x="24" y="136" width="172" height="54" rx="6"/>
  <text class="hb" x="110" y="168" text-anchor="middle"><tspan x="110">content 内容</tspan></text>
  <rect class="box" x="196" y="136" width="199" height="54"/>
  <text class="hb" x="296" y="168" text-anchor="middle"><tspan x="296">padding 内边距</tspan></text>
  <path class="divider" d="M196,136 L196,190"/>
  <rect class="box" x="395" y="136" width="157" height="54"/>
  <text class="hb" x="474" y="168" text-anchor="middle"><tspan x="474">border 边框</tspan></text>
  <path class="divider" d="M395,136 L395,190"/>
  <rect class="box" x="552" y="136" width="184" height="54"/>
  <text class="hb" x="644" y="168" text-anchor="middle"><tspan x="644">margin 外边距</tspan></text>
  <path class="divider" d="M552,136 L552,190"/>
  <rect class="outline" x="24" y="136" width="712" height="54" rx="6"/>
  <path class="spoke" d="M110,196 L110,206 L108,218"/>
  <text class="s" x="108" y="239" text-anchor="middle"><tspan x="108">装文字与图片的那一层；默</tspan><tspan x="108" dy="17">认盒模型的 width /</tspan><tspan x="108" dy="17">height 只量它</tspan></text>
  <path class="spoke" d="M296,196 L296,206 L289,218"/>
  <text class="s" x="289" y="239" text-anchor="middle"><tspan x="289">边框与内容之间的空间，把</tspan><tspan x="289" dy="17">内容往里撑——增加的是自己</tspan><tspan x="289" dy="17">内部的空间</tspan></text>
  <path class="spoke" d="M474,196 L474,206 L471,218"/>
  <text class="s" x="471" y="239" text-anchor="middle"><tspan x="471">包住 padding 与内容的一</tspan><tspan x="471" dy="17">道框，哪怕只有一两个像素</tspan><tspan x="471" dy="17">也占地方</tspan></text>
  <path class="spoke" d="M644,196 L644,206 L652,218"/>
  <text class="s" x="652" y="239" text-anchor="middle"><tspan x="652">盒子的边框与相邻盒子的边</tspan><tspan x="652" dy="17">框之间的空间，把别的盒</tspan><tspan x="652" dy="17">子推开</tspan></text>
</svg>
