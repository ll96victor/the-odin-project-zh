<svg xmlns="http://www.w3.org/2000/svg" width="740" height="262" viewBox="0 0 740 262" role="img" aria-labelledby="t-class-vs-prototype-mapping d-class-vs-prototype-mapping">
  <title id="t-class-vs-prototype-mapping">class 语法 ↔ 构造器 + 原型：逐条对照</title>
  <desc id="d-class-vs-prototype-mapping">左右两栏对比图。左栏「class 语法（ES6）」：class Player { ... } 声明包住整个蓝图；constructor 在 new 时自动执行、装实例数据；类体里直接写的方法自动住在 prototype 上；漏写 new 直接抛 TypeError（防护内置）。右栏「构造器 + 原型（上一课）」：function Player(...) 的函数体装实例数据；手动写 Player.prototype.method 赋值；方法住在原型上、全体实例共享；漏写 new 静默错误行为（要自己加 new.target 防护）。图下说明：底层机制没有变、没有经典继承在发生——class 是构造器 + 原型的新语法；另外类体自动严格模式、方法默认不可枚举。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="22" y="22" width="335" height="170" rx="8"/>
  <path class="divider" d="M22,62 L357,62"/>
  <rect class="head" x="22" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="22" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M22,62 L357,62"/>
  <text class="hb" x="190" y="47" text-anchor="middle"><tspan x="190">class 语法（ES6）</tspan></text>
  <circle cx="42" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="86" text-anchor="start"><tspan x="52">class Player { ... } 包住整个蓝图</tspan></text>
  <circle cx="42" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="116" text-anchor="start"><tspan x="52">constructor 在 new 时自动执行、装实例数据</tspan></text>
  <circle cx="42" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="146" text-anchor="start"><tspan x="52">类体里的方法自动住在 prototype 上</tspan></text>
  <circle cx="42" cy="172" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="176" text-anchor="start"><tspan x="52">漏写 new 直接抛 TypeError（防护内置）</tspan></text>
  <rect class="box" x="383" y="22" width="335" height="170" rx="8"/>
  <path class="divider" d="M383,62 L718,62"/>
  <rect class="head" x="383" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="383" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M383,62 L718,62"/>
  <text class="hb" x="551" y="47" text-anchor="middle"><tspan x="551">构造器 + 原型（上一课）</tspan></text>
  <circle cx="403" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="86" text-anchor="start"><tspan x="413">function Player(...) 的函数体装实例数据</tspan></text>
  <circle cx="403" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="116" text-anchor="start"><tspan x="413">手动写 Player.prototype.method 赋值</tspan></text>
  <circle cx="403" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="146" text-anchor="start"><tspan x="413">方法住在原型上、全体实例共享</tspan></text>
  <circle cx="403" cy="172" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="176" text-anchor="start"><tspan x="413">漏写 new 静默错误（自己加 new.target）</tspan></text>
  <rect class="note" x="22" y="206" width="696" height="34" rx="6"/>
  <text class="s" x="370" y="228" text-anchor="middle"><tspan x="370">底层机制没有变、没有经典继承在发生——class 是构造器 + 原型的新语法；类体自动严格模式、方法默认不可枚举。</tspan></text>
</svg>
