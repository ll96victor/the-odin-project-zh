<svg xmlns="http://www.w3.org/2000/svg" width="612" height="296" viewBox="0 0 612 296" role="img" aria-labelledby="t-auth-session-chain d-auth-session-chain">
  <title id="t-auth-session-chain">登录态链路：从比对密码到 req.user</title>
  <desc id="d-auth-session-chain">流程图，六步折两行。第一步登录 POST /log-in——passport.authenticate 触发；第二步 LocalStrategy 查库比对——bcrypt.compare 拿明文与库里哈希比；第三步 serializeUser 存 user.id——只把 id 写进会话数据；第四步 connect.sid cookie 下发——express-session 在幕后创建；第五步后续请求带 cookie 回来——passport 匹配到会话；第六步 deserializeUser 按 id 查库——把用户对象挂上 req.user。图下注：三个函数只定义不手动调用——LocalStrategy 管验证、序列化对管存取，登录态住在 cookie，服务器每次按 id 还原用户。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #878c87; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="26" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="102" y="55" text-anchor="middle"><tspan x="102">登录 POST /log-in</tspan></text>
  <text class="s" x="102" y="68" text-anchor="middle"><tspan x="102">passport.authenticat</tspan><tspan x="102" dy="15">e触发</tspan></text>
  <rect class="box" x="230" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="306" y="46" text-anchor="middle"><tspan x="306">LocalStrategy 查</tspan><tspan x="306" dy="18">库比对</tspan></text>
  <text class="s" x="306" y="68" text-anchor="middle"><tspan x="306">bcrypt.compare 明文</tspan><tspan x="306" dy="15">与哈希</tspan></text>
  <path class="edge" d="M178,57 L223,57" marker-end="url(#arr)"/>
  <rect class="box" x="434" y="26" width="152" height="62" rx="6"/>
  <text class="hb" x="510" y="46" text-anchor="middle"><tspan x="510">serializeUser 存</tspan><tspan x="510" dy="18">user.id</tspan></text>
  <text class="s" x="510" y="75" text-anchor="middle"><tspan x="510">只把 id 写进会话数据</tspan></text>
  <path class="edge" d="M382,57 L427,57" marker-end="url(#arr)"/>
  <rect class="box" x="26" y="150" width="152" height="62" rx="6"/>
  <text class="hb" x="102" y="170" text-anchor="middle"><tspan x="102">connect.sid</tspan><tspan x="102" dy="18">cookie 下发</tspan></text>
  <text class="s" x="102" y="192" text-anchor="middle"><tspan x="102">express-session 幕</tspan><tspan x="102" dy="15">后创建</tspan></text>
  <rect class="box" x="230" y="150" width="152" height="62" rx="6"/>
  <text class="hb" x="306" y="170" text-anchor="middle"><tspan x="306">后续请求带</tspan><tspan x="306" dy="18">cookie 回来</tspan></text>
  <text class="s" x="306" y="199" text-anchor="middle"><tspan x="306">passport 匹配到会话</tspan></text>
  <path class="edge" d="M178,181 L223,181" marker-end="url(#arr)"/>
  <rect class="accentbox" x="434" y="150" width="152" height="62" rx="6"/>
  <text class="hb" x="510" y="170" text-anchor="middle"><tspan x="510">deserializeUser</tspan><tspan x="510" dy="18">按 id 查库</tspan></text>
  <text class="s" x="510" y="192" text-anchor="middle"><tspan x="510">用户对象挂上</tspan><tspan x="510" dy="15">req.user</tspan></text>
  <path class="edge" d="M382,181 L427,181" marker-end="url(#arr)"/>
  <path class="edge" d="M510,88 L510,119 L102,119 L102,143" marker-end="url(#arr)"/>
  <rect class="note" x="26" y="218" width="560" height="52" rx="6"/>
  <text class="s" x="306" y="240" text-anchor="middle"><tspan x="306">三个函数只定义不手动调用：LocalStrategy 管「验证」、序列化对管「存取」——登录态住在</tspan><tspan x="306" dy="18">cookie，服务器每次按 id 还原用户。</tspan></text>
</svg>
