<svg xmlns="http://www.w3.org/2000/svg" width="740" height="280" viewBox="0 0 740 280" role="img" aria-labelledby="t-monolith-vs-decoupled d-monolith-vs-decoupled">
  <title id="t-monolith-vs-decoupled">单体 vs 前后端分离：渲染模板还是出 JSON</title>
  <desc id="d-monolith-vs-decoupled">两列对比图。左列单体（渲染模板）：一个 Express 应用包办一切；路由 render EJS 模板回 HTML；业务逻辑与视图逻辑混在一起；前后端同一仓库、同一次部署。右列前后端分离（Jamstack）：后端只出 JSON（res.json）；前端独立静态托管（GitHub Pages、Netlify）；一个后端服务多个前端（网站、桌面、移动）；分开部署，跨域要靠 CORS 放行。图下注：分离的技术含量只有一行 res.json()，架构红利是模块化加一后端多前端，代价是跨域（CORS）与两次部署要各自照看。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #878c87; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="22" y="22" width="335" height="170" rx="8"/>
  <path class="divider" d="M22,62 L357,62"/>
  <rect class="head" x="22" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="22" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M22,62 L357,62"/>
  <text class="hb" x="190" y="47" text-anchor="middle"><tspan x="190">单体（渲染模板）</tspan></text>
  <circle cx="42" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="86" text-anchor="start"><tspan x="52">一个 Express 应用包办一切</tspan></text>
  <circle cx="42" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="116" text-anchor="start"><tspan x="52">路由 render EJS 模板回 HTML</tspan></text>
  <circle cx="42" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="146" text-anchor="start"><tspan x="52">业务逻辑与视图逻辑混在一起</tspan></text>
  <circle cx="42" cy="172" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="176" text-anchor="start"><tspan x="52">前后端同一仓库、同一次部署</tspan></text>
  <rect class="box" x="383" y="22" width="335" height="170" rx="8"/>
  <path class="divider" d="M383,62 L718,62"/>
  <rect class="head" x="383" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="383" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M383,62 L718,62"/>
  <text class="hb" x="551" y="47" text-anchor="middle"><tspan x="551">前后端分离（Jamstack）</tspan></text>
  <circle cx="403" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="86" text-anchor="start"><tspan x="413">后端只出 JSON（res.json）</tspan></text>
  <circle cx="403" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="116" text-anchor="start"><tspan x="413">前端独立静态托管（Pages / Netlify）</tspan></text>
  <circle cx="403" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="146" text-anchor="start"><tspan x="413">一个后端服务多个前端（网站/桌面/移动）</tspan></text>
  <circle cx="403" cy="172" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="176" text-anchor="start"><tspan x="413">分开部署——跨域要靠 CORS 放行</tspan></text>
  <rect class="note" x="22" y="206" width="696" height="52" rx="6"/>
  <text class="s" x="370" y="228" text-anchor="middle"><tspan x="370">分离的技术含量只有一行 res.json()；架构红利是模块化 +</tspan><tspan x="370" dy="18">一后端多前端；代价是跨域（CORS）与两次部署要各自照 看。</tspan></text>
</svg>
