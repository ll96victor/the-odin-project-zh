<svg xmlns="http://www.w3.org/2000/svg" width="760" height="316" viewBox="0 0 760 316" role="img" aria-labelledby="t-commit-length-50-72 d-commit-length-50-72">
  <title id="t-commit-length-50-72">两个字符数口径的关系：50 与 72</title>
  <desc id="d-commit-length-50-72">解剖图。顶部三个小盒：这一课涉及两个容易混的数字；50 是写作建议；72 是显示上限。主体横条把 subject 字符数画成一把尺，从左到右两段：往 50 字符靠——出自官方 Assignment 指定要读的那篇文章的「七条规则」，把 subject 限制在 50 字符左右，是更严格的写作建议；72 字符封顶——出自本课官方 tip 框，GitHub 有一个 72 字符的限制。下方注释说明两者关系：日常写法上 subject 尽量短、往 50 靠，整条说明不超过 72 字符宽，两个口径就都满足了；本站两个口径都保留，不把建议描述成 Git 命令自身的硬限制。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="chip" x="175" y="24" width="110" height="38" rx="6"/>
  <text class="b" x="230" y="48" text-anchor="middle"><tspan x="230">两个数字容易混</tspan></text>
  <rect class="chip" x="325" y="24" width="110" height="38" rx="6"/>
  <text class="b" x="380" y="48" text-anchor="middle"><tspan x="380">50 = 写作建议</tspan></text>
  <path class="edge" d="M289,43 L318,43" marker-end="url(#arr)"/>
  <rect class="chip" x="475" y="24" width="110" height="38" rx="6"/>
  <text class="b" x="530" y="48" text-anchor="middle"><tspan x="530">72 = 显示上限</tspan></text>
  <path class="edge" d="M439,43 L468,43" marker-end="url(#arr)"/>
  <text class="h" x="380" y="117" text-anchor="middle"><tspan x="380">subject 字符数的两个口径</tspan></text>
  <rect class="accentbox" x="24" y="136" width="373" height="54" rx="6"/>
  <text class="hb" x="211" y="168" text-anchor="middle"><tspan x="211">往 50 字符靠</tspan></text>
  <rect class="box" x="397" y="136" width="339" height="54"/>
  <text class="hb" x="567" y="168" text-anchor="middle"><tspan x="567">72 字符封顶</tspan></text>
  <path class="divider" d="M397,136 L397,190"/>
  <rect class="outline" x="24" y="136" width="712" height="54" rx="6"/>
  <path class="spoke" d="M211,196 L211,206 L136,218"/>
  <text class="s" x="136" y="239" text-anchor="middle"><tspan x="136">出自官方 Assignment 指定文章的「</tspan><tspan x="136" dy="17">七条规则」：把 subject 限制在 50</tspan><tspan x="136" dy="17">字符左右——更严格的写作建议</tspan></text>
  <path class="spoke" d="M567,196 L567,206 L624,218"/>
  <text class="s" x="624" y="239" text-anchor="middle"><tspan x="624">出自本课 tip 框：GitHub 的 72 字</tspan><tspan x="624" dy="17">符显示限制。日常写法 subject 尽量</tspan><tspan x="624" dy="17">短、整条不超 72 字符宽，两个口径</tspan><tspan x="624" dy="17">同时满足</tspan></text>
</svg>
