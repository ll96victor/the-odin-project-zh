<svg xmlns="http://www.w3.org/2000/svg" width="740" height="232" viewBox="0 0 740 232" role="img" aria-labelledby="t-grid-auto-fit-vs-fill d-grid-auto-fit-vs-fill">
  <title id="t-grid-auto-fit-vs-fill">auto-fit vs auto-fill：填不满时的分岔</title>
  <desc id="d-grid-auto-fit-vs-fill">左右两栏对比图，比较 repeat() 的两个自动计数值在项目填不满一行时的差异。左栏标题「auto-fit · 用项目填满行」：空轨道被折叠，现有项目拉伸到最大值（例如 1fr）；项目比列数少时，项目撑满整行；典型场景是卡片流，希望卡片占满容器宽度。右栏标题「auto-fill · 保留空轨道」：空轨道被保留，项目缩回最小值（例如 150px）；项目比列数少时，行尾留着空位；典型场景是给未来的项目预留格位、保持项目尺寸稳定。图下说明：两者只在项目填不满一行时有差别；项目填满行时渲染结果完全一样，因此选择依据是「空出来的时候，你要项目撑满还是留格位」。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #878c87; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="22" y="22" width="335" height="140" rx="8"/>
  <path class="divider" d="M22,62 L357,62"/>
  <rect class="head" x="22" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="22" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M22,62 L357,62"/>
  <text class="hb" x="190" y="47" text-anchor="middle"><tspan x="190">auto-fit · 用项目填满行</tspan></text>
  <circle cx="42" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="86" text-anchor="start"><tspan x="52">空轨道被折叠，项目拉伸到最大值（如 1fr）</tspan></text>
  <circle cx="42" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="116" text-anchor="start"><tspan x="52">项目比列数少时：撑满整行</tspan></text>
  <circle cx="42" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="52" y="146" text-anchor="start"><tspan x="52">典型场景：卡片流要占满容器宽度</tspan></text>
  <rect class="box" x="383" y="22" width="335" height="140" rx="8"/>
  <path class="divider" d="M383,62 L718,62"/>
  <rect class="head" x="383" y="22" width="335" height="40" rx="8"/>
  <rect class="head" x="383" y="48" width="335" height="14" rx="0"/>
  <path class="divider" d="M383,62 L718,62"/>
  <text class="hb" x="551" y="47" text-anchor="middle"><tspan x="551">auto-fill · 保留空轨道</tspan></text>
  <circle cx="403" cy="82" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="86" text-anchor="start"><tspan x="413">空轨道被保留，项目缩回最小值（如 150px）</tspan></text>
  <circle cx="403" cy="112" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="116" text-anchor="start"><tspan x="413">项目比列数少时：行尾留空位</tspan></text>
  <circle cx="403" cy="142" r="2.5" fill="#276148"/>
  <text class="b" x="413" y="146" text-anchor="start"><tspan x="413">典型场景：给未来的项目预留格位、尺寸稳定</tspan></text>
  <rect class="note" x="22" y="176" width="696" height="34" rx="6"/>
  <text class="s" x="370" y="198" text-anchor="middle"><tspan x="370">只在「项目填不满一行」时有差别；填满行时渲染完全一样——选择依据：空出来时，要项目撑满还是留格位。</tspan></text>
</svg>
