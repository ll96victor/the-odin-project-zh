<svg xmlns="http://www.w3.org/2000/svg" width="732" height="483" viewBox="0 0 732 483" role="img" aria-labelledby="t-memoization-toolbox d-memoization-toolbox">
  <title id="t-memoization-toolbox">React 缓存工具箱：四件工具各管一段</title>
  <desc id="d-memoization-toolbox">中心辐射图。中心是 React 缓存工具箱，副题注明先用 Profiler 测量再动手，过早优化是万恶之源。四个卫星节点：useMemo，缓存任何值——昂贵计算只在依赖变化时重算；useCallback，只缓存函数——等价于 useMemo 返回函数的简写，配 memo 子组件防引用变化；memo，包裹组件——props 引用相等时跳过重渲染，父渲染不连带；React Compiler，构建期自动记忆化——多数场景不再手写，但手动知识仍必修。图下注：值用 useMemo、函数用 useCallback、组件用 memo、自动交给 Compiler——先测量，确实需要才出手。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276148"/>
    </marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #2f3430; }
    .h { font-size: 15px; font-weight: 700; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #276148; }
    .b { font-size: 13.5px; }
    .s { font-size: 12.5px; fill: #68706a; }
    .box { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .accentbox { fill: #e8eee9; stroke: #a9bcb0; stroke-width: 1.5; }
    .head { fill: #e8eee9; stroke: #276148; stroke-width: 1.5; }
    .chip { fill: #fbfbfa; stroke: #c9cec8; stroke-width: 1.25; }
    .note { fill: #f4f5f2; stroke: #c9cec8; stroke-width: 1.5; }
    .edge { stroke: #276148; stroke-width: 2; fill: none; }
    .dash { stroke: #68706a; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .life { stroke: #c9cec8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .spoke { stroke: #8b918b; stroke-width: 1.5; fill: none; }
    .divider { stroke: #c9cec8; stroke-width: 1.5; fill: none; }
    .outline { fill: none; stroke: #c9cec8; stroke-width: 1.5; }
  </style>

  <path class="spoke" d="M366,197 L366,105"/>
  <path class="spoke" d="M456,242 L484,242"/>
  <path class="spoke" d="M366,286 L366,379"/>
  <path class="spoke" d="M276,242 L248,242"/>
  <rect class="accentbox" x="276" y="197" width="180" height="89" rx="10"/>
  <text class="hb" x="366" y="231" text-anchor="middle"><tspan x="366">React 缓存工具箱</tspan></text>
  <text class="s" x="366" y="247" text-anchor="middle"><tspan x="366">先用 Profiler 测量再动手——过早优</tspan><tspan x="366" dy="16">化是万恶之源</tspan></text>
  <rect class="box" x="252" y="29" width="228" height="76" rx="6"/>
  <text class="hb" x="366" y="51" text-anchor="middle"><tspan x="366">useMemo</tspan></text>
  <text class="s" x="366" y="67" text-anchor="middle"><tspan x="366">缓存任何值：昂贵计算只在依赖变化</tspan><tspan x="366" dy="17">时重算，否则返回缓存</tspan></text>
  <rect class="box" x="484" y="195" width="228" height="93" rx="6"/>
  <text class="hb" x="598" y="218" text-anchor="middle"><tspan x="598">useCallback</tspan></text>
  <text class="s" x="598" y="234" text-anchor="middle"><tspan x="598">只缓存函数：useMemo(() =&gt; fn,</tspan><tspan x="598" dy="17">deps) 的简写——配 memo 子组件防</tspan><tspan x="598" dy="17">引用变化</tspan></text>
  <rect class="box" x="252" y="379" width="228" height="76" rx="6"/>
  <text class="hb" x="366" y="401" text-anchor="middle"><tspan x="366">memo()</tspan></text>
  <text class="s" x="366" y="417" text-anchor="middle"><tspan x="366">包裹组件：props 引用相等跳过重渲</tspan><tspan x="366" dy="17">染——父渲染不连带</tspan></text>
  <rect class="box" x="20" y="204" width="228" height="76" rx="6"/>
  <text class="hb" x="134" y="226" text-anchor="middle"><tspan x="134">React Compiler</tspan></text>
  <text class="s" x="134" y="242" text-anchor="middle"><tspan x="134">构建期自动记忆化：多数场景不再手</tspan><tspan x="134" dy="17">写——手动知识仍必修</tspan></text>
</svg>
